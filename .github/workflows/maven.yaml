name: Prueba ROCKSI REAL

on:
  push:
    branches: [ "Main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: admin
          MYSQL_DATABASE: rocksi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -padmin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar cliente MySQL
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Esperar MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -padmin --silent; then
              echo "MySQL listo"
              exit 0
            fi
            echo "Esperando MySQL..."
            sleep 2
          done
          echo "MySQL no respondió a tiempo"
          exit 1

      - name: Importar dump SQL
        run: |
          DUMP_FILE=$(find . -maxdepth 1 -type f \( -name 'Dump.sql' -o -name 'Dump*.sql' \) | head -n 1)
          if [ -z "$DUMP_FILE" ]; then
            echo "No se encontró Dump.sql o Dump*.sql en la raíz del repositorio"
            exit 1
          fi
          echo "Importando $DUMP_FILE en la base rocksi"
          mysql -h 127.0.0.1 -P 3306 -uroot -padmin rocksi < "$DUMP_FILE"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Construir proyecto (WAR)
      - name: Construir WAR
        run: mvn clean package -DskipTests

      # Descargar Tomcat 11.0.8
      - name: Descargar Tomcat 11.0.8
        run: |
          wget https://archive.apache.org/dist/tomcat/tomcat-11/v11.0.8/bin/apache-tomcat-11.0.8.tar.gz
          tar -xzf apache-tomcat-11.0.8.tar.gz

      # Copiar WAR como ROOT
      - name: Copiar WAR
        run: cp Vista/target/*.war apache-tomcat-11.0.8/webapps/ROOT.war

      # Iniciar servidor
      - name: Iniciar Tomcat
        run: |
          cd apache-tomcat-11.0.8/bin
          chmod +x startup.sh
          ./startup.sh

      # Diagnóstico inicial de endpoints
      - name: Diagnosticar servidor
        run: |
          echo "===== GET / ====="
          curl -i http://localhost:8080/ || true
          echo "===== GET /api/app/user ====="
          curl -i http://localhost:8080/api/app/user || true
          echo "===== GET /api/api/app/user ====="
          curl -i http://localhost:8080/api/api/app/user || true

      # Esperar a que la app responda
      - name: Esperar servidor
        run: |
          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            if [ "$STATUS" = "200" ]; then
              echo "Servidor listo (HTTP 200)"
              exit 0
            fi
            echo "Esperando servidor... intento $i, status=$STATUS"
            sleep 2
          done
          echo "La app no respondió HTTP 200 a tiempo"
          echo "===== Tomcat catalina.out ====="
          tail -n 200 apache-tomcat-11.0.8/logs/catalina.out || true
          echo "===== Tomcat localhost logs ====="
          ls -lah apache-tomcat-11.0.8/logs || true
          tail -n 200 apache-tomcat-11.0.8/logs/localhost*.log || true
          exit 1

      # Node para Playwright
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegadores
        run: npx playwright install

        # Pruebas unitarias
      - name: Ejecutar pruebas unitarias
        run: mvn install -DskipTests && mvn test -pl persistencia

      # Ejecutar pruebas reales
      - name: Ejecutar pruebas UI
        run: npx playwright test --reporter=html || true
      
      # Ejecutar pruebas de API (Postman/Newman)
      - name: Ejecutar pruebas Postman
        run: npx newman run ROCKSI_API_TEST.postman_collection.json --reporters cli,junit --reporter-junit-export newman-report.xml

      # Guardar reportes
      - name: Guardar reporte pruebas unitarias
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-unitarias
          path: persistencia/target/surefire-reports/
      - name: Guardar reporte pruebas UI
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-ui
          path: playwright-report/
      - name: Guardar reporte pruebas Postman
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-postman
          path: newman-report.xml