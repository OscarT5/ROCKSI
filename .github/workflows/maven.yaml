name: Prueba ROCKSI REAL

on:
  push:
    branches: [ "Main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: admin
          MYSQL_DATABASE: rocksi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -padmin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar cliente MySQL
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Esperar MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -padmin --silent; then
              echo "MySQL listo"
              exit 0
            fi
            echo "Esperando MySQL..."
            sleep 2
          done
          echo "MySQL no respondió a tiempo"
          exit 1

      - name: Importar dump SQL
        run: |
          DUMP_FILE=$(find . -maxdepth 1 -type f \( -name 'Dump.sql' -o -name 'Dump*.sql' \) | head -n 1)
          if [ -z "$DUMP_FILE" ]; then
            echo "No se encontró Dump.sql o Dump*.sql en la raíz del repositorio"
            exit 1
          fi
          echo "Importando $DUMP_FILE en la base rocksi"
          mysql -h 127.0.0.1 -P 3306 -uroot -padmin rocksi < "$DUMP_FILE"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Construir proyecto (WAR)
      - name: Construir WAR
        run: mvn clean package -DskipTests

      # Descargar Tomcat 9
      - name: Descargar Tomcat 9
        run: |
          wget https://archive.apache.org/dist/tomcat/tomcat-9/v9.0.89/bin/apache-tomcat-9.0.89.tar.gz
          tar -xzf apache-tomcat-9.0.89.tar.gz

      # Copiar WAR como ROOT
      - name: Copiar WAR
        run: cp Vista/target/*.war apache-tomcat-9.0.89/webapps/ROOT.war

      # Iniciar servidor
      - name: Iniciar Tomcat
        run: |
          cd apache-tomcat-9.0.89/bin
          chmod +x startup.sh
          ./startup.sh

      # Esperar que levante
      - name: Esperar servidor
        run: sleep 40

      # Node para Playwright
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegadores
        run: npx playwright install

        # Pruebas unitarias
      - name: Ejecutar pruebas unitarias
        run: mvn install -DskipTests && mvn test -pl persistencia

      # Ejecutar pruebas reales
      - name: Ejecutar pruebas UI
        run: npx playwright test --reporter=html || true
      
      # Ejecutar pruebas de API (Postman/Newman)
      - name: Ejecutar pruebas Postman
        run: npx newman run ROCKSI_API_TEST.postman_collection.json --reporters cli,junit --reporter-junit-export newman-report.xml

      # Guardar reportes
      - name: Guardar reporte pruebas unitarias
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-unitarias
          path: persistencia/target/surefire-reports/
      - name: Guardar reporte pruebas UI
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-ui
          path: playwright-report/
      - name: Guardar reporte pruebas Postman
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-postman
          path: newman-report.xml