<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
    <style>
        .ui-dialog { border-radius: 15px !important; border: none !important; background: white !important; }
        .ui-dialog-titlebar { background: white !important; border: none !important; text-align: center !important; font-weight: bold; }
        .ui-dialog-content { background: white !important; border: none !important; }
        .form-control, .ui-inputfield {
            border: none; border-bottom: 2px solid #ccc; border-radius: 0;
            background: transparent; color: #000; font-size: 15px;
        }
        .form-control:focus, .ui-inputfield:focus { border-color: #919191 !important; outline: none !important; }
        .ui-button {
            border: none !important; border-radius: 8px !important; padding: 10px 16px !important;
            font-weight: 600 !important; font-size: 15px !important;
            width: 80% !important; margin: 15px auto 0 auto !important;
        }
    </style>
</h:head>

<h:body>
    <h:form id="formPrincipal">
        <p:commandButton value="Realizar Compra"
                         icon="pi pi-shopping-cart"
                         onclick="PF('dlgAskId').show();"
                         type="button"/>

        <p:dialog header="Identifícate" widgetVar="dlgAskId" modal="true"
                  resizable="false" closable="true" draggable="false" width="360">
            <h:panelGrid columns="1" style="width:100%;">
                <p:messages id="msgsId" showDetail="true" closable="true"/>
                <div class="form-group">
                    <h:outputLabel for="searchId" value="ID Usuario Recepcionista"/>
                    <p:inputText id="searchId"
                                 value="#{RealizarPagoBeanUI.idUR}"
                                 placeholder="Ej. UR0001"
                                 styleClass="form-control"
                                 required="true"
                                 requiredMessage="El ID es obligatorio"/>
                </div>

                <p:commandButton value="Siguiente"
                                 icon="pi pi-search"
                                 action="#{RealizarPagoBeanUI.verificarUsuario}"
                                 update="msgsId"
                                 process="@this searchId"
                                 oncomplete="if (!args.validationFailed) { PF('dlgAskId').hide(); PF('dlgAskPass').show(); }"
                                 styleClass="ui-button"
                                 style="background:#007bff; color:#fff;"/>

            </h:panelGrid>
        </p:dialog>

        <p:dialog header="Validar contraseña" widgetVar="dlgAskPass" modal="true"
                  resizable="false" closable="true" draggable="false" width="360">
            <h:panelGrid columns="1" style="width:100%;">
                <p:messages id="msgsPass" showDetail="true" closable="true"/>
                <div class="form-group">
                    <h:outputLabel for="pass" value="Contraseña del Recepcionista"/>
                    <p:password id="pass"
                                value="#{RealizarPagoBeanUI.contrasenaUR}"
                                feedback="false"
                                styleClass="form-control"
                                required="true"
                                requiredMessage="Debe ingresar la contraseña"/>
                </div>

                <p:commandButton value="Validar"
                                 icon="pi pi-lock"
                                 action="#{RealizarPagoBeanUI.validarContrasena}"
                                 update="msgsPass"
                                 process="@this pass"
                                 oncomplete="if (!args.validationFailed) { PF('dlgAskPass').hide(); PF('dlgTipoPago').show(); }"
                                 styleClass="ui-button"
                                 style="background:#28a745; color:#fff;"/>
            </h:panelGrid>
        </p:dialog>

        <p:dialog header="¿Qué desea pagar?" widgetVar="dlgTipoPago" modal="true"
                  resizable="false" closable="true" draggable="false" width="360">
            <h:panelGrid columns="1" style="width:100%; text-align:center;">
                <p:messages id="msgsTipoPago" showDetail="true" closable="true"/>

                <h:outputText value="Seleccione el tipo de pago a realizar."
                              style="font-size:16px; margin-bottom: 20px; display:block;"/>

                <p:commandButton value="Pagar Membresía"
                                 icon="pi pi-id-card"
                                 actionListener="#{RealizarPagoBeanUI.setTipoPago('membresia')}"
                                 process="@this"
                                 update="msgsTipoPago"
                                 oncomplete="PF('dlgTipoPago').hide(); PF('dlgMetodoPago').show();"
                                 style="margin-bottom:10px; background:#007bff; color:#fff;"/>

                <p:commandButton value="Pagar Clase"
                                 icon="pi pi-book"
                                 actionListener="#{RealizarPagoBeanUI.setTipoPago('clase')}"
                                 process="@this"
                                 update="msgsTipoPago"
                                 oncomplete="PF('dlgTipoPago').hide(); PF('dlgMetodoPago').show();"
                                 style="background:#17a2b8; color:#fff;"/>
            </h:panelGrid>
        </p:dialog>

        <p:dialog header="Seleccionar Método de Pago" widgetVar="dlgMetodoPago"
                  modal="true" resizable="false" closable="false" draggable="false" width="360">
            <h:panelGrid id="panelMetodoPago" columns="1" style="width:100%; text-align:center;">

                <p:messages id="msgsMetodoPago" showDetail="true" closable="true"/>

                <div class="form-group">
                    <h:outputLabel for="cliente" value="Cliente (opcional)" style="font-weight:bold;"/>
                    <p:inputText id="cliente"
                                 value="#{RealizarPagoBeanUI.idCliente}"
                                 maxlength="7"
                                 onkeydown="if(event.key === 'Enter'){event.preventDefault(); return false;}"
                                 placeholder="CLI1000"
                                 styleClass="form-control">
                    </p:inputText>
                </div>

                <div class="form-group">
                    <h:outputLabel for="descuento" value="Descuento (opcional)" style="font-weight:bold;"/>
                    <p:inputText id="descuento"
                                 value="#{RealizarPagoBeanUI.descuento}"
                                 maxlength="5"
                                 onkeydown="if(event.key === 'Enter'){event.preventDefault(); return false;}"
                                 placeholder="$200"
                                 styleClass="form-control">
                    </p:inputText>
                </div>

                <p:commandButton value="Pago en Efectivo"
                                 icon="pi pi-money-bill"
                                 actionListener="#{RealizarPagoBeanUI.prepararPago}"
                                 process="@this cliente descuento"
                                 update="panelMetodoPago :formPrincipal:panelPagoInteractivo :formPrincipal:panelAplicarCredito"
                                 oncomplete="if (!args.validationFailed) {
                                    PF('dlgMetodoPago').hide();
                                    if (args.tieneCredito) {
                                   PF('dlgAplicarCredito').show();
                                         } else {
                                        PF('dlgPagoInteractivo').show();
                                    }
                                }"
                                 style="margin-bottom:10px; background:#ffc107; color:#000;">
                    <f:param name="proximo" value="dlgPagoInteractivo" />
                </p:commandButton>

                <p:commandButton value="Pago con Tarjeta"
                                 icon="pi pi-credit-card"
                                 actionListener="#{RealizarPagoBeanUI.prepararPago}"
                                 process="@this cliente descuento"
                                 update="panelMetodoPago :formPrincipal:panelPagoTarjeta :formPrincipal:panelAplicarCredito"
                                 oncomplete="if (!args.validationFailed) {
                                    PF('dlgMetodoPago').hide();
                                    if (args.tieneCredito) {
                                        PF('dlgAplicarCredito').show();
                                    } else {
                                        PF('dlgPagoTarjeta').show();
                                    }
                                }"
                                 style="background:#17a2b8; color:#fff;">
                    <f:param name="proximo" value="dlgPagoTarjeta" />
                </p:commandButton>

            </h:panelGrid>
        </p:dialog>

        <p:dialog header="Confirmar Crédito" widgetVar="dlgAplicarCredito"
                  modal="true" resizable="false" closable="false" draggable="false" width="420">
            <h:panelGrid id="panelAplicarCredito" columns="1" style="width:100%; text-align:center;">
                <p:messages id="msgsCredito" showDetail="true" closable="true"/>

                <h:outputText value="El cliente tiene un crédito disponible de:"
                              style="font-size:16px;"/>

                <h:outputText value="#{RealizarPagoBeanUI.cliente.credito}"
                              style="font-size:22px; font-weight:bold; color:#28a745; margin:5px 0;">
                    <f:convertNumber type="currency" currencySymbol="$"/>
                </h:outputText>

                <h:outputText value="Total actual de la compra:"
                              style="font-size:16px; margin-top:10px;"/>
                <h:outputText value="#{RealizarPagoBeanUI.montoTotal}"
                              style="font-size:18px; font-weight:bold;">
                    <f:convertNumber type="currency" currencySymbol="$"/>
                </h:outputText>

                <h:outputText value="¿Desea aplicar el crédito a esta compra?"
                              style="font-size:16px; margin-top:15px; font-weight:bold;"/>

                <h:outputText value="Esta acción es irreversible y modificará el saldo del cliente."
                              style="font-size:13px; font-style:italic; color:#777;"/>

                <p:commandButton value="Sí, Aplicar Crédito"
                                 icon="pi pi-check"
                                 action="#{RealizarPagoBeanUI.aplicarCredito}"
                                 process="@this"
                                 update="panelAplicarCredito msgsCredito :formPrincipal:panelPagoTarjeta :formPrincipal:panelPagoInteractivo"
                                 oncomplete="if (!args.validationFailed) { PF('dlgAplicarCredito').hide(); PF('#{RealizarPagoBeanUI.siguienteDialogo}').show(); }"
                                 style="background:#28a745; color:#fff;"/>

                <p:commandButton value="No, Pagar Completo"
                                 icon="pi pi-times"
                                 type="button"
                                 onclick="PF('dlgAplicarCredito').hide(); PF('#{RealizarPagoBeanUI.siguienteDialogo}').show();"
                                 style="background:#dc3545; color:#fff;"/>

            </h:panelGrid>
        </p:dialog>

        <p:dialog header="Pago con Tarjeta"
                  widgetVar="dlgPagoTarjeta"
                  modal="true"
                  resizable="false"
                  closable="false"
                  draggable="false"
                  width="420">

            <h:panelGrid id="panelPagoTarjeta" columns="1" style="width:100%;">
                <p:messages id="msgsTarjeta" showDetail="true" closable="true"/>

                <h:outputText value="Información del Cliente:" style="font-weight:bold; margin-bottom:10px;"/>

                <h:panelGrid columns="2" columnClasses="label,value" style="width:100%;">
                    <h:outputText value="ID Cliente:" style="color:#000000;"/>
                    <h:outputText value="#{RealizarPagoBeanUI.cliente.idCliente}" style="color:#000000;"/>

                    <h:outputText value="Nombre del cliente:" style="color:#000000;"/>
                    <h:outputText value="#{RealizarPagoBeanUI.cliente.nombreCompleto}" style="color:#000000;"/>

                    <h:outputText value="Monto Total:" style="color:#000000;"/>
                    <h:outputText value="#{RealizarPagoBeanUI.montoTotal}" style="color:#000000;"/>

                    <h:outputText value="Fecha:" style="color:#000000;"/>
                    <h:outputText value="#{RealizarPagoBeanUI.fecha}" style="color:#000000;">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                    </h:outputText>

                    <h:outputText value="Método de pago:"/>
                    <h:outputText value="Tarjeta de crédito/débito" style="color:#17a2b8; font-weight:bold;"/>
                </h:panelGrid>

                <h:outputText value="Por favor, realice el cobro manual en la terminal bancaria."
                              style="margin-top:10px; display:block; text-align:center; font-style:italic;"/>

                <h:panelGroup layout="block" style="margin-top:15px; text-align:center;">
                    <p:commandButton id="btnPagoTarjeta"
                                     value="Pagar"
                                     process="@this"
                                     update="msgsTarjeta"
                                     actionListener="#{RealizarPagoBeanUI.realizarPagoTarjeta}"/>

                    <p:commandButton value="Cancelar"
                                     icon="pi pi-times"
                                     actionListener="#{RealizarPagoBeanUI.limpiarCampos()}"
                                     update="@form"
                                     process="@this"
                                     oncomplete="PF('dlgPagoTarjeta').hide();"
                                     style="background:#dc3545; color:#fff;"/>
                </h:panelGroup>
            </h:panelGrid>
        </p:dialog>

        <p:dialog id="dlgExitoTarjeta"
                  header="Pago Realizado"
                  widgetVar="dlgExitoTarjeta"
                  modal="true"
                  resizable="false"
                  closable="false"
                  draggable="false"
                  width="300">

            <h:panelGrid columns="1" style="width:100%; text-align:center;">
                <h:outputText value="Pago realizado con éxito"
                              style="font-weight:bold; font-size:18px; color:#28a745;"/>

                <h:outputText value="El cobro con tarjeta se procesó correctamente."
                              style="font-size:14px; color:#333; margin-top:10px;"/>

                <p:commandButton value="Continuar"
                                 icon="pi pi-check"
                                 actionListener="#{RealizarPagoBeanUI.limpiarCampos}"
                                 onclick="PF('dlgExitoTarjeta').hide();"
                                 update="@form"
                                 style="margin-top:15px; background:#28a745; color:#fff; width:100%;"/>
            </h:panelGrid>
        </p:dialog>

        <p:dialog header="Realizar Pago en Efectivo"
                  widgetVar="dlgPagoInteractivo"
                  modal="true"
                  resizable="false"
                  closable="true"
                  draggable="false"
                  width="400">

            <h:panelGrid id="panelPagoInteractivo" columns="1" style="width:100%;">
                <p:messages id="msgsPagoInteractivo" showDetail="true" closable="true"/>

                <div class="form-group">
                    <h:outputLabel for="montoIngresado" value="Monto ingresado"/>

                    <p:inputText id="montoIngresado"
                                 value="#{RealizarPagoBeanUI.montoIngresado}"
                                 maxlength="5"
                                 onkeydown="if(event.key === 'Enter'){event.preventDefault(); return false;}"
                                 style="text-align:left;">
                        <p:ajax event="keyup" update="faltante" process="@this"/>
                    </p:inputText>
                </div>

                <div class="form-group">
                    <h:outputLabel value="Monto restante"/>
                    <h:outputText id="faltante" value="#{RealizarPagoBeanUI.montoFaltante}"/>
                </div>

                <p:commandButton value="Pagar"
                                 action="#{RealizarPagoBeanUI.realizarPagoInteractivo}"
                                 update="msgsPagoInteractivo faltante"
                                 styleClass="ui-button"
                                 process="@this montoIngresado"
                                 style="background:#28a745; color:#fff;"/>
            </h:panelGrid>
        </p:dialog>

        <p:dialog id="dlgCambio"
                  header="Cambio Entregado"
                  widgetVar="dlgCambio"
                  modal="true"
                  resizable="false"
                  closable="false"
                  draggable="false"
                  width="300">

            <h:panelGrid columns="1" style="width:100%; text-align:center;">
                <h:outputText value="Cambio:" style="font-weight:bold; font-size:18px;"/>
                <h:outputText value="$#{RealizarPagoBeanUI.montoCambio}"
                              style="font-size:22px; color:#28a745; margin:10px 0; display:block;">
                    <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2"/>
                </h:outputText>

                <p:commandButton value="Continuar"
                                 icon="pi pi-check"
                                 actionListener="#{RealizarPagoBeanUI.limpiarCampos}"
                                 onclick="PF('dlgCambio').hide();"
                                 update="@form"
                                 style="margin-top:10px; background:#28a745; color:#fff; width:100%;"/>
            </h:panelGrid>
        </p:dialog>

    </h:form>
</h:body>
</html>
