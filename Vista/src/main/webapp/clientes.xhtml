<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Clientes - Rock On</title>
    <meta charset="UTF-8"/>

    <style>
        body {
            margin: 0;
            font-family: "Poppins", Arial, sans-serif;
            background-color: #f8f9fb;
        }

        .sidebar { width: 220px; height: 100vh; background: #007bcb; color: white; position: fixed; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .sidebar .menu { width: 100%; padding-top: 30px; }
        .sidebar a, .sidebar h\:commandLink { display: flex; align-items: center; gap: 10px; color: white !important; text-decoration: none !important; padding: 10px 20px; font-size: 15px; transition: background 0.3s, transform 0.2s; margin-bottom: 10px; }
        .sidebar a:hover, .sidebar h\:commandLink:hover, .sidebar .active { background: #0061a6 !important; border-radius: 6px; }
        .menu-icon { width: 22px; height: 22px; filter: brightness(0) invert(1); transition: transform 0.2s ease; }
        .sidebar h\:commandLink:hover .menu-icon { transform: scale(1.15); }
        .sidebar .logo-bottom { padding: 25px 0; }
        .sidebar .logo-bottom img { width: 130px; border-radius: 50%; }

        .main-content { margin-left: 220px; padding: 10px 20px; }

        .header { display: flex; align-items: center; padding-bottom: 10px; border-bottom: 3px solid #007bcb; margin-bottom: 20px; background-color: #f8f9fb; }
        .header img { height: 60px; }

        .card { background: white; border-radius: 12px; padding: 20px 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;}
        .card h2 { margin: 0; font-size: 20px; color: #111; font-weight: 700; }

        .action-buttons { display: flex; gap: 10px; align-items: center; }

        .btn-custom { background: #007bcb !important; border: none !important; color: white !important; font-weight: normal !important; border-radius: 5px !important; padding: 6px 15px !important; font-size: 14px !important; box-shadow: none !important; text-shadow: none !important; }
        .btn-custom:hover { background: #005fa3 !important; }

        .btn-danger { background: #dc3545 !important; border: none !important; color: white !important; font-weight: normal !important; border-radius: 5px !important; padding: 6px 15px !important; font-size: 14px !important; box-shadow: none !important; text-shadow: none !important; }
        .btn-danger:hover { background: #c82333 !important; }

        .clean-table.ui-datatable { border: none !important; background: #ffffff !important; }
        .clean-table .ui-datatable-tablewrapper { overflow: visible !important; }
        .clean-table thead th.ui-state-default { background: #ffffff !important; border: none !important; border-bottom: 1px solid #eaeaea !important; color: #000 !important; font-weight: 700 !important; text-transform: none !important; padding: 15px 10px !important; text-align: left !important; box-shadow: none !important; }
        .clean-table thead th.ui-state-active, .clean-table thead th.ui-state-hover { background: #ffffff !important; box-shadow: none !important; }
        .clean-table .ui-datatable-data tr.ui-widget-content, .clean-table .ui-datatable-data tr.ui-datatable-even, .clean-table .ui-datatable-data tr.ui-datatable-odd { background: #ffffff !important; border: none !important; }
        .clean-table tbody td { border: none !important; border-bottom: 1px solid #f4f4f4 !important; padding: 18px 10px !important; color: #333 !important; font-size: 14px !important; }
        .clean-table .ui-datatable-data tr:hover, .clean-table .ui-datatable-data tr.ui-state-hover { background-color: #fafafa !important; box-shadow: none !important; font-weight: normal !important; color: #333 !important; }

        .ui-dialog .ui-dialog-titlebar { background: white !important; border: none !important; border-bottom: 1px solid #f0f0f0 !important; padding: 15px 20px !important; }
        .ui-dialog .ui-dialog-title { font-size: 18px !important; color: #333 !important; font-weight: 700 !important; }
        .ui-dialog .ui-dialog-content { padding: 20px !important; background: white !important; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; font-size: 14px; }
        .ui-dialog .ui-dialog-titlebar-close:hover, .ui-dialog .ui-dialog-titlebar-close:focus { background-color: #dc3545 !important; background-image: none !important; border-color: #dc3545 !important; color: #ffffff !important; transform: scale(1.1); transition: all 0.2s ease; opacity: 1 !important; }
        .search-input { width: 200px !important; margin-right: 10px; }

        .ui-inputfield, .ui-inputtext, .ui-inputmask {
            width: 100%; box-sizing: border-box; padding: 8px !important;
            border-radius: 5px !important; border: 1px solid #ccc !important;
            box-shadow: none !important; background-image: none !important;
        }

        .ui-inputfield.ui-state-focus,
        .ui-inputfield:focus,
        .ui-inputtext:focus,
        .ui-inputnumber.ui-state-focus > input,
        .ui-selectonemenu.ui-state-focus {
            border-color: #007bcb !important;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 203, 0.25) !important;
            outline: none !important;
            background-image: none !important;
        }

        .ui-inputfield:hover,
        .ui-inputtext:hover,
        .ui-selectonemenu:hover {
            border-color: #007bcb !important;
        }
        .ui-selectonemenu {
            width: 100% !important; padding-right: 0 !important;
            background: #ffffff !important; background-image: none !important;
        }
        .ui-selectonemenu .ui-selectonemenu-trigger {
            background: transparent !important; border: none !important;
            border-left: 1px solid #eee !important; width: 30px !important;
        }
        .ui-selectonemenu-panel .ui-selectonemenu-item.ui-state-highlight,
        .ui-selectonemenu-panel .ui-selectonemenu-item.ui-state-hover {
            background: #007bcb !important; color: white !important; text-shadow: none !important;
        }

    </style>
</h:head>

<h:body>
    <div class="sidebar">
        <div class="menu">
            <h:form>
                <h:commandLink action="home.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('home')}"
                               styleClass="#{menuBeanUI.activePage eq 'home' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/home.png" alt="Home Icon" class="menu-icon"/>
                    <span>Home</span>
                </h:commandLink>

                <h:commandLink action="clientes.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('clientes')}"
                               styleClass="#{menuBeanUI.activePage eq 'clientes' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/clientes.png" alt="Clientes Icon" class="menu-icon"/>
                    <span>Clientes</span>
                </h:commandLink>

                <h:commandLink action="tienda.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('tienda')}"
                               styleClass="#{menuBeanUI.activePage eq 'tienda' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/tienda.png" alt="Tienda Icon" class="menu-icon"/>
                    <span>Tienda</span>
                </h:commandLink>

                <h:commandLink action="clases.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('clases')}"
                               styleClass="#{menuBeanUI.activePage eq 'clases' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/clases.png" alt="Clases Icon" class="menu-icon"/>
                    <span>Clases</span>
                </h:commandLink>

                <h:commandLink action="pagos.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('pagos')}"
                               styleClass="#{menuBeanUI.activePage eq 'pagos' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/pagos.png" alt="Pagos Icon" class="menu-icon"/>
                    <span>Pagos</span>
                </h:commandLink>
            </h:form>
        </div>

        <div class="logo-bottom">
            <img src="resources-20250903T164359Z-1-001/resources/rockon-icon.png" alt="Rock On Logo"/>
        </div>
    </div>

    <div class="main-content">

        <div class="header">
            <img src="resources-20250903T164359Z-1-001/resources/Rock_on_text_logo.png" alt="Rock On Title"/>
        </div>

        <div class="card">
            <h:form id="formClientes">

                <div class="card-header">
                    <h2>Gestión de Clientes</h2>

                    <div class="action-buttons">
                        <p:inputText id="txtFiltro" value="#{clienteBeanUI.filtroId}" placeholder="Buscar por ID" styleClass="search-input">
                            <p:ajax event="input" listener="#{clienteBeanUI.filtrarPorId}" update="tablaClientes" process="@this" delay="300"/>
                        </p:inputText>

                        <p:commandButton value="Actualizar" icon="pi pi-refresh"
                                         actionListener="#{clienteBeanUI.probarConexion()}"
                                         process="@this" update="formClientes:tablaClientes"
                                         styleClass="btn-custom"/>

                        <p:commandButton value="Nuevo" icon="pi pi-user-plus"
                                         onclick="PF('dlgAgregarCliente').show();"
                                         type="button" styleClass="btn-custom"/>

                        <p:commandButton value="Modificar" icon="pi pi-user-edit"
                                         onclick="PF('dlgAskId').show();"
                                         type="button" styleClass="btn-custom"/>

                        <p:commandButton value="Baja" icon="pi pi-user-minus"
                                         type="button" onclick="PF('dlgEliminarCliente').show();"
                                         styleClass="btn-danger"/>
                    </div>
                </div>

                <p:dataTable id="tablaClientes" value="#{clienteBeanUI.listaClientes}" var="cli" lazy="false"
                             rowKey="#{cli.idCliente}" paginator="true" rows="10"
                             emptyMessage="No hay clientes registrados"
                             styleClass="clean-table"
                             paginatorPosition="bottom">

                    <p:column style="width:40px; text-align:center;">
                        <p:rowToggler />
                    </p:column>

                    <p:column headerText="ID" sortBy="#{cli.idCliente}" width="10%">
                        <h:outputText value="#{cli.idCliente}" style="font-weight: 600;"/>
                    </p:column>

                    <p:column headerText="Nombre" sortBy="#{cli.nombreCompleto}">
                        <h:outputText value="#{cli.nombreCompleto.split(' ')[0]}"/>
                    </p:column>

                    <p:column headerText="Apellidos" sortBy="#{cli.apellido}">
                        <h:outputText value="#{cli.apellido}"/>
                    </p:column>

                    <p:column headerText="Sexo" sortBy="#{cli.sexo}" width="10%">
                        <h:outputText value="#{cli.sexo}"/>
                    </p:column>

                    <p:column headerText="Teléfono" sortBy="#{cli.telefono}">
                        <h:outputText value="#{cli.telefono}"/>
                    </p:column>

                    <p:column headerText="Registro" sortBy="#{cli.fechaRegistro}">
                        <h:outputText value="#{cli.fechaRegistro}">
                            <f:convertDateTime pattern="dd/MM/yyyy"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Crédito" sortBy="#{cli.credito}">
                        <h:outputText value="#{cli.credito}" style="font-weight:bold; color: #{cli.credito lt 0 ? '#dc3545' : '#333'};">
                            <f:convertNumber type="currency" currencySymbol="$"/>
                        </h:outputText>
                    </p:column>

                    <p:rowExpansion>
                        <div style="padding: 10px 20px; background: #fcfcfc; border-radius: 8px;">
                            <h4 style="margin: 0 0 10px 0; color: #007bcb;">Clases Asignadas</h4>
                            <p:dataTable value="#{cli.clases}" var="cla" emptyMessage="Sin clases asignadas" styleClass="clean-table">
                                <p:column headerText="ID Clase"><h:outputText value="#{cla.idClase}" /></p:column>
                                <p:column headerText="Nombre"><h:outputText value="#{cla.nombre}" /></p:column>
                                <p:column headerText="Horario"><h:outputText value="#{cla.horario}" /></p:column>
                                <p:column headerText="Maestro"><h:outputText value="#{cla.maestro}" /></p:column>
                            </p:dataTable>
                        </div>
                    </p:rowExpansion>
                </p:dataTable>

                <p:dialog header="Nuevo cliente" widgetVar="dlgAgregarCliente" modal="true" resizable="false" width="400" appendTo="@(body)">
                    <h:form id="formAltaCliente">
                        <p:messages id="msgsAlta" showDetail="true" closable="true"/>

                        <div class="form-group"><h:outputLabel value="Nombre"/><p:inputText value="#{altaCliBeanUI.nombre}" required="true"/></div>
                        <div class="form-group"><h:outputLabel value="Apellidos"/><p:inputText value="#{altaCliBeanUI.apellido}" required="true"/></div>

                        <div class="form-group">
                            <h:outputLabel value="Sexo"/>
                            <p:selectOneMenu value="#{altaCliBeanUI.sexo}" style="width:100%" required="true">
                                <f:selectItem itemLabel="Seleccione..." itemValue=""/>
                                <f:selectItem itemLabel="Masculino" itemValue="Masculino"/>
                                <f:selectItem itemLabel="Femenino" itemValue="Femenino"/>
                                <f:selectItem itemLabel="Otro" itemValue="Otro"/>
                            </p:selectOneMenu>
                        </div>

                        <div class="form-group"><h:outputLabel value="Teléfono"/><p:inputMask value="#{altaCliBeanUI.telefono}" mask="(999) 999-9999" required="true"/></div>
                        <div class="form-group"><h:outputLabel value="Tel. Secundario"/><p:inputMask value="#{altaCliBeanUI.segundoTelefono}" mask="(999) 999-9999"/></div>

                        <p:commandButton value="Registrar" action="#{altaCliBeanUI.altaCliente}" update="msgsAlta :formClientes:tablaClientes" styleClass="btn-custom" style="width:100%"/>
                    </h:form>
                </p:dialog>

                <p:dialog header="Buscar cliente" widgetVar="dlgAskId" modal="true" resizable="false" width="350" appendTo="@(body)">
                    <h:form id="formAskId">
                        <p:messages id="msgsAsk" showDetail="true" closable="true"/>
                        <div class="form-group"><h:outputLabel value="ID Cliente"/><p:inputText value="#{modificarCliBeanUI.busquedaId}" placeholder="Ej. CLI1001" required="true"/></div>
                        <p:commandButton value="Buscar" icon="pi pi-search" action="#{modificarCliBeanUI.cargarClientePorId}"
                                         oncomplete="if (args &amp;&amp; args.found) { PF('dlgAskId').hide(); PF('dlgModificarCliente').loadContents(); }"
                                         styleClass="btn-custom" style="width:100%"/>
                    </h:form>
                </p:dialog>

                <p:dialog id="dlgModificar" header="Modificar cliente" widgetVar="dlgModificarCliente" modal="true" resizable="false" width="400" appendTo="@(body)">
                    <h:form id="formModificarCliente">
                        <p:messages id="msgsModificar" showDetail="true" closable="true"/>
                        <div class="form-group"><h:outputLabel value="Nombre"/><p:inputText value="#{modificarCliBeanUI.nombre}" required="true"/></div>
                        <div class="form-group"><h:outputLabel value="Apellidos"/><p:inputText value="#{modificarCliBeanUI.apellido}" required="true"/></div>
                        <div class="form-group">
                            <h:outputLabel value="Sexo"/>
                            <p:selectOneMenu value="#{modificarCliBeanUI.sexo}" style="width:100%">
                                <f:selectItem itemLabel="Masculino" itemValue="masculino"/>
                                <f:selectItem itemLabel="Femenino" itemValue="femenino"/>
                                <f:selectItem itemLabel="Otro" itemValue="otro"/>
                            </p:selectOneMenu>
                        </div>
                        <div class="form-group"><h:outputLabel value="Teléfono"/><p:inputMask value="#{modificarCliBeanUI.telefono}" mask="(999) 999-9999" required="true"/></div>
                        <div class="form-group"><h:outputLabel value="Tel. Secundario"/><p:inputMask value="#{modificarCliBeanUI.segundoTelefono}" mask="(999) 999-9999"/></div>
                        <p:commandButton value="Guardar Cambios" action="#{modificarCliBeanUI.modificarCliente}" update="msgsModificar :formClientes:tablaClientes" styleClass="btn-custom" style="width:100%"/>
                    </h:form>
                </p:dialog>

                <p:dialog header="Eliminar Cliente" widgetVar="dlgEliminarCliente" modal="true" resizable="false" width="350" appendTo="@(body)">
                    <h:form id="formEliminarCliente">
                        <p:messages id="msgsEliminar" showDetail="true" closable="true"/>
                        <div class="form-group"><h:outputLabel value="ID Cliente"/><p:inputText value="#{bajaClienteBeanUI.idCliente}" required="true"/></div>

                        <p:commandButton value="Eliminar" icon="pi pi-trash" onclick="PF('dlgConfirmar').show(); return false;" styleClass="btn-danger" style="width:100%"/>

                        <p:confirmDialog widgetVar="dlgConfirmar" header="Confirmación" message="¿Seguro que deseas eliminar este cliente?" showEffect="fade" hideEffect="fade" appendTo="@(body)">
                            <p:commandButton value="Sí, eliminar" action="#{bajaClienteBeanUI.eliminarCliente}"
                                             update=":formEliminarCliente:msgsEliminar :formClientes:tablaClientes"
                                             oncomplete="PF('dlgConfirmar').hide();" styleClass="btn-danger"/>
                            <p:commandButton value="Cancelar" onclick="PF('dlgConfirmar').hide();" type="button" styleClass="btn-custom" />
                        </p:confirmDialog>
                    </h:form>
                </p:dialog>

            </h:form>
        </div>
    </div>
</h:body>
</html>
