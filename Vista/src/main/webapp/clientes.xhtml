<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Clientes - Rock On</title>
    <meta charset="UTF-8"/>

    <style>
        body {
            margin: 0;
            font-family: "Poppins", Arial, sans-serif;
            background-color: #f8f9fb;
        }

        /* BARRA LATERAL */
        .sidebar {
            width: 220px;
            height: 100vh;
            background: #007bcb;
            color: white;
            position: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Menú principal dentro de la barra lateral */
        .sidebar .menu {
            width: 100%;
            padding-top: 30px;
        }

        /* Enlaces del menú  */
        .sidebar a,
        .sidebar h\:commandLink {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white !important;
            text-decoration: none !important;
            padding: 10px 20px;
            font-size: 15px;
            transition: background 0.3s, transform 0.2s;
            margin-bottom: 10px;
        }

        /* Hover y estado activo */
        .sidebar a:hover,
        .sidebar h\:commandLink:hover,
        .sidebar .active {
            background: #0061a6 !important;
            border-radius: 6px;
        }

        /* Ícono dentro del menú */
        .menu-icon {
            width: 22px;
            height: 22px;
            filter: brightness(0) invert(1);
            transition: transform 0.2s ease;
        }

        /* Animación de ícono al pasar el mouse */
        .sidebar h\:commandLink:hover .menu-icon {
            transform: scale(1.15);
        }

        /* Logo inferior */
        .sidebar .logo-bottom {
            padding: 25px 0;
        }

        .sidebar .logo-bottom img {
            width: 130px;
            border-radius: 50%;
        }

        /* ESTILOS GENERALES */
        body {
            margin: 0;
            font-family: "Poppins", Arial, sans-serif;
            background-color: #f8f9fb;
        }

        /* CONTENEDOR PRINCIPAL */
        .main-content {
            margin-left: 220px;
            padding: 30px 40px;
        }

        /* Encabezado de la página (título "Clientes") */
        .header-clientes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #007bcb;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .header-clientes h1 {
            font-size: 26px;
            color: #000;
            margin: 0;
            font-weight: 700;
        }

        /* TARJETA CONTENEDORA */
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        /* BOTONES DE ACCIÓN */
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .action-buttons .ui-button {
            border: none !important;
            border-radius: 20px !important;
            font-weight: 600 !important;
            padding: 6px 16px !important;
            font-size: 14px !important;
        }

        .btn-registrar {
            background: #007bcb !important;
            color: #fff !important;
        }

        .btn-modificar {
            background: #007bcb !important;
            color: #fff !important;
        }

        .btn-baja {
            background: #007bcb !important;
            color: #fff !important;
        }

        /* TABLA DE CLIENTES */
        .ui-datatable {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: none !important;
            margin-top: 5px;
        }

        .ui-datatable thead th {
            background-color: #007bcb !important;
            color: white !important;
            text-align: left !important;
            font-weight: 600 !important;
            padding: 10px 12px !important;
            border: none !important;
            font-size: 14px !important;
        }

        .ui-datatable tbody td {
            padding: 10px 12px !important;
            font-size: 14px !important;
            color: #222;
            border: none !important;
        }

        .ui-datatable tr:nth-child(even) {
            background-color: #f9f9f9 !important;
        }

        .ui-datatable tr:nth-child(odd) {
            background-color: #fff !important;
        }

        .ui-datatable tr:hover {
            background-color: #eef7ff !important;
        }

        .ui-datatable-tablewrapper {
            border-radius: 10px;
            overflow: hidden;
        }

        /* Boton cerrar */
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-hover,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-focus {
            background: transparent !important;
            border: none !important;
            color: #555 !important;
            position: absolute !important;
            right: 10px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            transition: all 0.3s ease !important;
            box-shadow: none !important;
        }

        /* Boton cerrar on hover*/
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close:hover,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-hover:hover {
            background-color: #dc3545 !important;
            color: #fff !important;
            border-radius: 50% !important;
            width: 28px !important;
            height: 28px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        /* Titulo del modal */
        .ui-dialog-title {
            width: 100% !important;
            text-align: center !important;
            font-size: 24px !important;
            font-weight: 700 !important;
            color: #000 !important;
        }

        /* Contenido del modal */
        .form-group {
            background-color: #fff;
            border-radius: 15px;
            border: none;
            color: #000;
            padding: 20px;
        }

        /* Configracion del layout del modal */
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            width: 90%;
        }

        /* Configracion del layout del modal */
        .form-group label {
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }

        /* Configuracion de estilo en el cuerpo del modal */
        .ui-dialog {
            background: white !important;
            border-radius: 15px !important;
            border: none !important;
        }

        /* Configuracion del titulo del modal */
        .ui-dialog-titlebar {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            position: relative;
            background: white !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* Configuracion de estilo en el cuerpo del modal */
        .form-group {
            background: white !important;
            border: none !important;
        }

        /* Configuracion de estilo en el cuerpo del modal */
        .form-group {
            border: none;
            border-bottom: 2px solid #ccc;
            border-radius: 0;
            background: transparent;
            color: #000;
            font-size: 15px;
        }

        /* Configuracion de estilo en los campos cuando se aplica un focus*/
        .form-group:focus,
        .form-group:focus {
            border-color: #919191 !important;
            outline: none !important;
        }

        /* Configuracion en del boton registrar cliente*/
        .boton-registrar {
            border: none !important;
            border-radius: 8px !important;
            padding: 10px 16px !important;
            font-weight: 600 !important;
            font-size: 15px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 15px auto 0 auto !important;
            width: 80% !important;
        }

        /* Configuracion en del boton registrar cliente*/
        .boton-registrar {
            margin-right: 8px;
            font-size: 16px;
        }
    </style>
</h:head>

<h:body>
    <!-- Barra lateral -->
    <div class="sidebar">
        <div class="menu">
            <h:form>
                <!-- HOME -->
                <h:commandLink action="home.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('home')}"
                               styleClass="#{menuBeanUI.activePage eq 'home' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/home.png" alt="Home Icon" class="menu-icon"/>
                    <span>Home</span>
                </h:commandLink>

                <!-- CLIENTES -->
                <h:commandLink action="clientes.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('clientes')}"
                               styleClass="#{menuBeanUI.activePage eq 'clientes' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/clientes.png" alt="Clientes Icon" class="menu-icon"/>
                    <span>Clientes</span>
                </h:commandLink>

                <!-- TIENDA -->
                <h:commandLink action="tienda.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('tienda')}"
                               styleClass="#{menuBeanUI.activePage eq 'tienda' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/tienda.png" alt="Tienda Icon" class="menu-icon"/>
                    <span>Tienda</span>
                </h:commandLink>

                <!-- CLASES -->
                <h:commandLink action="clases.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('clases')}"
                               styleClass="#{menuBeanUI.activePage eq 'clases' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/clases.png" alt="Clases Icon" class="menu-icon"/>
                    <span>Clases</span>
                </h:commandLink>

                <!-- PAGOS -->
                <h:commandLink action="pagos.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('pagos')}"
                               styleClass="#{menuBeanUI.activePage eq 'pagos' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/pagos.png" alt="Pagos Icon" class="menu-icon"/>
                    <span>Pagos</span>
                </h:commandLink>
            </h:form>
        </div>

        <!-- Logo inferior -->
        <div class="logo-bottom">
            <img src="resources-20250903T164359Z-1-001/resources/rockon-icon.png" alt="Rock On Logo"/>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="card">
            <h:form id="formClientes">
                <h1>Clientes</h1>

                <div class="action-buttons">
                    <h:outputLabel for="txtFiltro" value="ID Cliente"/>
                    <p:inputText id="txtFiltro" value="#{clienteBeanUI.filtroId}" placeholder="Buscar por ID Cliente">
                        <p:ajax event="input" listener="#{clienteBeanUI.filtrarPorId}" update="tablaClientes" process="@this" delay="300"/>
                    </p:inputText>

                    <p:commandButton value="Actualizar Tabla" icon="pi pi-refresh"
                                     action="#{clienteBeanUI.init}" update="tablaClientes" process="@this"
                                     delay="300" styleClass="btn-registrar"/>

                    <p:commandButton value="Registrar Cliente" icon="pi pi-user-plus"
                                     onclick="PF('dlgAgregarCliente').show();" styleClass="btn-registrar"/>

                    <p:commandButton value="Modificar Cliente" icon="pi pi-user-edit"
                                     onclick="PF('dlgAskId').show();" styleClass="btn-modificar"/>

                    <p:commandButton value="Baja de Cliente" icon="pi pi-user-minus"
                                     styleClass="btn-baja" type="button" onclick="PF('dlgEliminarCliente').show();"/>
                </div>

                <!--Titulo y configuracion del modal modal Alta de Cliente-->
                <p:dialog header="Nuevo cliente" widgetVar="dlgAgregarCliente" modal="true" resizable="false"
                          closable="true" draggable="false" width="360">
                    <!-- Mensajes -->
                    <p:messages id="msgsAlta" showDetail="true" closable="true"/>

                    <!-- Campo para ingresar nombre -->
                    <div class="form-group">
                        <h:outputLabel for="nombreAlta" value="Nombre"/>
                        <p:inputText id="nombreAlta" value="#{altaCliBeanUI.nombre}" placeholder="Nombre"
                                     class="form-control" required="true" requiredMessage="El campo Nombre es obligatorio"/>
                    </div>

                    <!-- Campo para ingresar apellidos -->
                    <div class="form-group">
                        <h:outputLabel for="apellidoAlta" value="Apellidos"/>
                        <p:inputText id="apellidoAlta" value="#{altaCliBeanUI.apellido}" placeholder="Apellidos"
                                     class="form-control" required="true" requiredMessage="El campo Apellidos es obligatorio"/>
                    </div>

                    <!-- Campo para ingresar teléfono -->
                    <div class="form-group">
                        <h:outputLabel for="telefonoAlta" value="Teléfono"/>
                        <p:inputMask id="telefonoAlta" value="#{altaCliBeanUI.telefono}" mask="(999) 999-9999"
                                     placeholder="(686) 185 8942" class="form-control"
                                     required="true" requiredMessage="El campo Teléfono es obligatorio"/>
                    </div>

                    <!-- Botón para registrar cliente -->
                    <div class="boton-registrar">
                        <p:commandButton id="registrarBtn" value="Registrar al cliente"
                                         action="#{altaCliBeanUI.altaCliente}"
                                         process="@this nombreAlta apellidoAlta telefonoAlta"
                                         update="msgsAlta tablaClientes"
                                         icon="pi pi-plus-circle" styleClass="btn"
                                         style="background: #007bff !important; background-image: none !important;
                                                color: #fff !important; border: none !important; box-shadow: none !important;"/>
                    </div>
                </p:dialog>

                <!-- pedir ID del cliente a modificar -->
                <p:dialog header="Buscar cliente a modificar" widgetVar="dlgAskId" modal="true" resizable="false"
                          closable="true" draggable="false" width="360">
                    <h:panelGrid columns="1" style="width:100%;">
                        <p:messages id="msgsAsk" showDetail="true" closable="true"/>

                        <div class="form-group">
                            <h:outputLabel for="searchId" value="ID Cliente"/>
                            <p:inputText id="searchId" value="#{modificarCliBeanUI.busquedaId}"
                                         placeholder="Ej. CLI1001" styleClass="form-control"
                                         required="true" requiredMessage="El ID es obligatorio"/>
                        </div>

                        <p:commandButton value="Buscar" icon="pi pi-search"
                                         action="#{modificarCliBeanUI.cargarClientePorId}"
                                         update="@form" process="@this searchId"
                                         oncomplete="if (args &amp;&amp; args.found) { PF('dlgAskId').hide(); PF('dlgModificarCliente').show(); } else { PF('dlgAskId').show(); }"
                                         styleClass="btn"
                                         style="background: #007bff !important; background-image: none !important;
                                                color: #fff !important; border: none !important; box-shadow: none !important;"/>
                    </h:panelGrid>
                </p:dialog>

                <!-- dialog de modificar cliente que solo se muestra en caso de que se haya encontrado el cliente por id -->
                <p:dialog header="Modificar cliente" widgetVar="dlgModificarCliente" modal="true" resizable="false"
                          closable="true" draggable="false" width="360">
                    <p:messages id="msgsModificar" showDetail="true" closable="true"/>

                    <div class="form-group">
                        <h:outputLabel for="nombreMod" value="Nombre"/>
                        <p:inputText id="nombreMod" value="#{modificarCliBeanUI.nombre}" placeholder="Nombre"
                                     class="form-control" required="true" requiredMessage="El campo Nombre es obligatorio"/>
                    </div>

                    <div class="form-group">
                        <h:outputLabel for="apellidoMod" value="Apellidos"/>
                        <p:inputText id="apellidoMod" value="#{modificarCliBeanUI.apellido}" placeholder="Apellidos"
                                     class="form-control" required="true" requiredMessage="El campo Apellidos es obligatorio"/>
                    </div>

                    <div class="form-group">
                        <h:outputLabel for="telefonoMod" value="Teléfono"/>
                        <p:inputMask id="telefonoMod" value="#{modificarCliBeanUI.telefono}" mask="(999) 999-9999"
                                     placeholder="(686) 185 8942" class="form-control"
                                     required="true" requiredMessage="El campo Teléfono es obligatorio"/>
                    </div>

                    <p:commandButton id="modificarBtn" value="Modificar al cliente"
                                     action="#{modificarCliBeanUI.modificarCliente}"
                                     process="@this nombreMod apellidoMod telefonoMod"
                                     update="msgsModificar" icon="pi pi-check" styleClass="btn"
                                     style="background: #007bff !important; background-image: none !important;
                                            color: #fff !important; border: none !important; box-shadow: none !important;"/>
                </p:dialog>

                <!-- dialog para bajas de cliente -->

                <p:dialog header="Eliminar Cliente" widgetVar="dlgEliminarCliente" modal="true" resizable="false"
                          closable="true" draggable="false" width="360">
                    <!-- Mensajes del backend -->
                    <p:messages id="msgsEliminar" showDetail="true" closable="true"/>

                    <div class="form-group">
                        <h:outputLabel for="idClienteEliminar" value="ID del Cliente"/>
                        <p:inputText id="idClienteEliminar" value="#{bajaClienteBeanUI.idCliente}"
                                     placeholder="ID del cliente a eliminar" class="form-control"
                                     required="true" requiredMessage="El campo ID es obligatorio"/>
                    </div>

                    <!-- Botón que abre el modal de confirmación -->
                    <p:commandButton id="abrirConfirmarClienteBtn" value="Eliminar Cliente"
                                     icon="pi pi-times-circle" styleClass="btn-baja"
                                     onclick="PF('dlgConfirmarEliminarCliente').show(); PF('dlgEliminarCliente').hide(); return false;"/>
                </p:dialog>

                <!-- dialog de confirmacion de eliminacion -->
                <p:dialog header="Confirmar eliminación" widgetVar="dlgConfirmarEliminarCliente"
                          modal="true" resizable="false" closable="false" draggable="false" width="360">
                    <div class="confirm-content" style="text-align:center; font-size:16px; font-weight:500;">
                        <p>¿Seguro que deseas eliminar este cliente?</p>
                    </div>

                    <div class="confirm-buttons" style="display:flex; justify-content:space-between; margin-top:20px;">
                        <!-- Botón de cancelar -->
                        <p:commandButton value="Cancelar" type="button"
                                         onclick="PF('dlgConfirmarEliminarCliente').hide(); PF('dlgEliminarCliente').show();"
                                         styleClass="btn-cancelar"
                                         style="background:#a8a8a8; color:white; border:none; border-radius:8px; width:45%;"/>

                        <!-- Botón de confirmar eliminación -->
                        <p:commandButton value="Eliminar" icon="pi pi-times-circle"
                                         action="#{bajaClienteBeanUI.eliminarCliente}" process="@form"
                                         update="msgsEliminar tablaClientes"
                                         styleClass="btn-confirmar"
                                         style="background:#d61e1e; color:white; border:none; border-radius:8px; width:45%;"
                                         oncomplete="PF('dlgConfirmarEliminarCliente').hide(); PF('dlgEliminarCliente').show();"/>
                    </div>
                </p:dialog>

                <!-- Tabla de clientes -->
                <p:dataTable id="tablaClientes" value="#{clienteBeanUI.listaClientes}" var="cli"
                             paginator="true" rows="5"
                             emptyMessage="No hay clientes registrados"
                             styleClass="clientes-tabla" paginatorPosition="bottom">

                    <p:column headerText="ID Cliente" sortBy="#{cli.idCliente}">
                        <h:outputText value="#{cli.idCliente}"/>
                    </p:column>

                    <p:column headerText="Nombre" sortBy="#{cli.nombreCompleto}">
                        <h:outputText value="#{cli.nombreCompleto.split(' ')[0]}"/>
                    </p:column>

                    <p:column headerText="Apellidos" sortBy="#{cli.apellido}">
                        <h:outputText value="#{cli.apellido}"/>
                    </p:column>

                    <p:column headerText="Teléfono" sortBy="#{cli.telefono}">
                        <h:outputText value="#{cli.telefono}"/>
                    </p:column>

                    <p:column headerText="Fecha de Registro" sortBy="#{cli.fechaRegistro}">
                        <h:outputText value="#{cli.fechaRegistro}">
                            <f:convertDateTime pattern="dd-MM-yyyy"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Crédito" sortBy="#{cli.credito}">
                        <h:outputText value="#{cli.credito}">
                            <f:convertNumber type="currency" currencySymbol="$"/>
                        </h:outputText>
                    </p:column>
                </p:dataTable>
            </h:form>
        </div>
    </div>
</h:body>
</html>
