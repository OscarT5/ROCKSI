<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Baja de Usuario</title>
    <style>
        /* Estilos copiados de PBI-GUS-US3 para mantener consistencia */
        .ui-dialog .ui-dialog-titlebar {
            background: transparent;
            border: none;
            font-size: 1.5em;
            text-align: center;
        }
        .ui-dialog-content {
            padding: 20px !important;
        }
        .field-label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        .custom-input {
            width: 100%;
            border: none;
            border-bottom: 2px solid #ccc;
            padding: 5px;
            background: transparent;
        }
        .custom-input:focus {
            border-bottom-color: #dc3545; /* Rojo al enfocar para indicar alerta/baja */
        }
        .btn-action {
            width: 100%;
            margin-top: 25px;
            border: none !important;
            font-weight: bold;
            color: white !important;
        }
        .text-center {
            text-align: center;
            display: block;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
    </style>
</h:head>
<h:body>

    <h:form id="formGlobal">
        <p:growl id="growlMsg" showDetail="true" life="3000"/>
    </h:form>

    <h:form>
        <p:commandButton value="Dar de Baja Usuario"
                         oncomplete="PF('dlgCapturaID').show();"
                         icon="pi pi-user-minus"
                         styleClass="ui-button-danger"/>
    </h:form>

    <p:dialog header="Eliminar" widgetVar="dlgCapturaID" modal="true"
              resizable="false" draggable="false" width="350" closeOnEscape="true">
        <h:form id="formCaptura">

            <h:outputLabel for="idInput" value="ID" styleClass="field-label"/>

            <p:inputText id="idInput" value="#{bajaUsuariosBeanUI.idUsuario}"
                         placeholder="ID del usuario recepcionista a eliminar"
                         styleClass="custom-input" required="true"
                         requiredMessage="Debes ingresar un ID para continuar."/>

            <p:commandButton value="Eliminar Usuario" icon="pi pi-times"
                             process="@form"
                             update=":formGlobal:growlMsg"
                             oncomplete="if (args &amp;&amp; !args.validationFailed) { PF('dlgCapturaID').hide(); PF('dlgConfirmEliminar').show(); }"
                             styleClass="btn-action"
                             style="background-color: #dc3545 !important;"/> </h:form>
    </p:dialog>

    <p:dialog widgetVar="dlgConfirmEliminar" modal="true"
              resizable="false" draggable="false" width="400" closeOnEscape="true" showHeader="false">

        <h:form id="formConfirm">
            <div style="padding-top: 20px;">
                <h:outputText value="¿Seguro que deseas eliminar este usuario?"
                              styleClass="text-center" style="font-weight: bold;"/>

                <div style="display: flex; justify-content: space-between; gap: 10px;">

                    <p:commandButton value="Cancelar"
                                     onclick="PF('dlgConfirmEliminar').hide(); PF('dlgCapturaID').show();"
                                     styleClass="btn-action"
                                     style="background-color: #6c757d !important; margin-top: 10px;"/>

                    <p:commandButton value="Eliminar"
                                     actionListener="#{bajaUsuariosBeanUI.bajaUsuario}"
                                     update=":formGlobal:growlMsg"
                                     oncomplete="if (args &amp;&amp; !args.validationFailed) { PF('dlgConfirmEliminar').hide(); }"
                                     styleClass="btn-action"
                                     style="background-color: #dc3545 !important; margin-top: 10px;"/>
                </div>
            </div>
        </h:form>
    </p:dialog>

</h:body>
</html>
