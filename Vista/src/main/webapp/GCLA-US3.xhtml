<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
    <!-- Tus estilos (los mantuve tal cual) -->
    <style>
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-hover,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-focus {
            background: transparent !important;
            border: none !important;
            color: #555 !important;
            position: absolute !important;
            right: 10px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            transition: all 0.3s ease !important;
            box-shadow: none !important;
        }

        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close:hover,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-hover:hover {
            background-color: #dc3545 !important;
            color: #fff !important;
            border-radius: 50% !important;
            width: 28px !important;
            height: 28px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .ui-dialog-title {
            width: 100% !important;
            text-align: center !important;
            font-size: 24px !important;
            font-weight: 700 !important;
            color: #000 !important;
        }

        .ui-dialog-content, .ui-widget-content {
            background-color: #fff;
            border-radius: 15px;
            border: none;
            color: #000;
            padding: 20px;
        }

        .ui-dialog {
            background: white !important;
            border-radius: 15px !important;
            border: none !important;
        }

        .ui-dialog-titlebar {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            position: relative;
            background: white !important;
            border: none !important;
            box-shadow: none !important;
        }

        .ui-dialog-content {
            background: white !important;
            border: none !important;
        }

        .form-control, .ui-inputfield {
            border: none;
            border-bottom: 2px solid #ccc;
            border-radius: 0;
            background: transparent;
            color: #000;
            font-size: 15px;
        }

        .form-control:focus, .ui-inputfield:focus {
            border-color: #919191 !important;
            outline: none !important;
        }

        .ui-button,
        .ui-button.ui-state-default,
        .ui-button.ui-button-success,
        .btn,
        .btn-success {
            border: none !important;
            border-radius: 8px !important;
            padding: 10px 16px !important;
            font-weight: 600 !important;
            font-size: 15px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 15px auto 0 auto !important;
            width: 80% !important;
        }

        .ui-button .pi {
            margin-right: 8px;
            font-size: 16px;
        }
    </style>
</h:head>
<h:body>

    <h:form id="formPrincipal">
        <p:commandButton value="Modificar Clase"
                         icon="pi pi-user-edit"
                         onclick="PF('dlgAskId').show();"
                         type="button"/>

        <!-- pedir ID del cliente a modificar -->
        <p:dialog header="Buscar clase a modificar" widgetVar="dlgAskId"
                  modal="true" resizable="false" closable="true" draggable="false"
                  width="360">
            <h:panelGrid columns="1" style="width:100%;">
                <p:messages id="msgsAsk" showDetail="true" closable="true"/>

                <div class="form-group">
                    <h:outputLabel for="searchId" value="ID Clase"/>
                    <p:inputText id="searchId"
                                 value="#{modificarClaBeanUI.busquedaId}"
                                 placeholder="Ej. CLA1001"
                                 styleClass="form-control"
                                 required="true"
                                 requiredMessage="El ID es obligatorio"/>
                </div>

                <p:commandButton value="Buscar"
                                 icon="pi pi-search"
                                 action="#{modificarClaBeanUI.cargarClasePorId}"
                                 update="@form"
                                 process="@this searchId"
                                 oncomplete="if (args &amp;&amp; args.found) { PF('dlgAskId').hide(); PF('dlgModificarCliente').show(); } else { PF('dlgAskId').show(); }"
                                 styleClass="btn"
                                 style="background: #007bff !important;
                                background-image: none !important;
                                color: #fff !important;
                                border: none !important;
                                box-shadow: none !important;"/>
            </h:panelGrid>
        </p:dialog>

        <!-- dialog de modificar cliente que solo se muestra en caso de que se haya encontrado el cliente por id -->
        <p:dialog header="Modificar clase"
                  widgetVar="dlgModificarCliente"
                  modal="true"
                  resizable="false"
                  closable="true"
                  draggable="false"
                  width="400">

            <!-- msj -->
            <p:messages id="msgs" showDetail="true" closable="true"/>

            <!-- campo de nombre -->
            <div class="form-group">
                <h:outputLabel for="nombre" value="Nombre"/>
                <p:inputText id="nombreClase"
                             value="#{modificarClaBeanUI.nombre}"
                             placeholder="Nombre"
                             class="form-control"
                             required="true"
                             requiredMessage="El campo Nombre es obligatorio"/>
            </div>

            <!-- Campo hora de inicio -->
            <div class="form-group">
                <h:outputLabel for="horarioI" value="Hora de inicio:"/>
                <p:datePicker id="horarioI"
                              value="#{modificarClaBeanUI.horaInicioDate}"
                              timeOnly="true"
                              pattern="HH:mm"
                              hourFormat="24"
                              placeholder="Selecciona un horario"
                              required="true"
                              requiredMessage="El campo Horario es obligatorio"
                              styleClass="form-control" />
            </div>

            <!-- Campo hora final -->
            <div class="form-group">
                <h:outputLabel for="horarioF" value="Hasta:"/>
                <p:datePicker id="horarioF"
                              value="#{modificarClaBeanUI.horaFinalDate}"
                              timeOnly="true"
                              pattern="HH:mm"
                              hourFormat="24"
                              placeholder="Selecciona un horario"
                              required="true"
                              requiredMessage="El campo Horario es obligatorio"
                              styleClass="form-control" />
            </div>

            <!-- campo de cupoMaximo -->
            <div class="form-group">
                <h:outputLabel for="cupoMaximo" value="Cupo máximo"/>
                <p:inputText id="cupoMaximo"
                             value="#{modificarClaBeanUI.cupoMaximo}"
                             placeholder="Ingrese el cupo máximo"
                             required="true"
                             requiredMessage="El campo Cupo máximo es obligatorio"
                             styleClass="form-control">
                    <f:validateLongRange minimum="1" />
                    <f:convertNumber integerOnly="true" />
                </p:inputText>
            </div>

            <!-- campo de mestro-->
            <div class="form-group">
                <h:outputLabel for="nombreMaestro" value="Nombre del maestro"/>
                <p:inputText id="nombreMaestro"
                             value="#{modificarClaBeanUI.maestro}"
                             placeholder="Mestro"
                             class="form-control"
                             required="true"
                             requiredMessage="El campo Nombre del maestro es obligatorio"/>
            </div>

            <!-- boton para modificar el cliente -->
            <p:commandButton id="modificarBtn"
                             value="Modificar clase"
                             action="#{modificarClaBeanUI.modificarClase}"
                             update="msgs"
                             icon="pi pi-plus-circle"
                             styleClass="btn"
                             style="background: #007bff !important;
                                    background-image: none !important;
                                    color: #fff !important;
                                    border: none !important;
                                    box-shadow: none !important;"/>
        </p:dialog>

    </h:form>

</h:body>
</html>
