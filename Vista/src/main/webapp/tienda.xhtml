<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Productos - Rock On</title>
    <meta charset="UTF-8"/>

    <style>
        body { margin: 0; font-family: "Poppins", Arial, sans-serif; background-color: #f8f9fb; }

        .sidebar { width: 220px; height: 100vh; background: #007bcb; color: white; position: fixed; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .sidebar .menu { width: 100%; padding-top: 30px; }
        .sidebar a, .sidebar h\:commandLink { display: flex; align-items: center; gap: 10px; color: white !important; text-decoration: none !important; padding: 10px 20px; font-size: 15px; transition: background 0.3s, transform 0.2s; margin-bottom: 10px; }
        .sidebar a:hover, .sidebar h\:commandLink:hover, .sidebar .active { background: #0061a6 !important; border-radius: 6px; }
        .menu-icon { width: 22px; height: 22px; filter: brightness(0) invert(1); transition: transform 0.2s ease; }
        .sidebar h\:commandLink:hover .menu-icon { transform: scale(1.15); }
        .sidebar .logo-bottom { padding: 25px 0; }
        .sidebar .logo-bottom img { width: 130px; border-radius: 50%; }

        .main-content { margin-left: 220px; padding: 10px 20px; }
        .header { display: flex; align-items: center; padding-bottom: 10px; border-bottom: 3px solid #007bcb; margin-bottom: 20px; background-color: #f8f9fb; }
        .header img { height: 60px; }

        /* CARDS */
        .card { background: white; border-radius: 12px; padding: 20px 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card h2 { margin: 0; font-size: 20px; color: #111; font-weight: 700; }

        /* BOTONES */
        .action-buttons { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn-custom { background: #007bcb !important; border: none !important; color: white !important; font-weight: normal !important; border-radius: 5px !important; padding: 6px 15px !important; font-size: 14px !important; box-shadow: none !important; text-shadow: none !important; }
        .btn-custom:hover { background: #005fa3 !important; }
        .btn-danger { background: #dc3545 !important; border: none !important; color: white !important; font-weight: normal !important; border-radius: 5px !important; padding: 6px 15px !important; font-size: 14px !important; box-shadow: none !important; text-shadow: none !important; }
        .btn-danger:hover { background: #c82333 !important; }
        .btn-warning { background: #cf962e !important; border: none !important; color: white !important; font-weight: normal !important; border-radius: 5px !important; padding: 6px 15px !important; }

        .clean-table.ui-datatable { border: none !important; background: #ffffff !important; }
        .clean-table .ui-datatable-tablewrapper { overflow: visible !important; }
        .clean-table thead th.ui-state-default { background: #ffffff !important; border: none !important; border-bottom: 1px solid #eaeaea !important; color: #000 !important; font-weight: 700 !important; text-transform: none !important; padding: 15px 10px !important; text-align: left !important; box-shadow: none !important; }
        .clean-table thead th.ui-state-active, .clean-table thead th.ui-state-hover { background: #ffffff !important; box-shadow: none !important; }
        .clean-table .ui-datatable-data tr.ui-widget-content, .clean-table .ui-datatable-data tr.ui-datatable-even, .clean-table .ui-datatable-data tr.ui-datatable-odd { background: #ffffff !important; border: none !important; }
        .clean-table tbody td { border: none !important; border-bottom: 1px solid #f4f4f4 !important; padding: 18px 10px !important; color: #333 !important; font-size: 14px !important; }
        .clean-table .ui-datatable-data tr:hover, .clean-table .ui-datatable-data tr.ui-state-hover { background-color: #fafafa !important; box-shadow: none !important; font-weight: normal !important; color: #333 !important; }

        .ui-inputfield:focus, .ui-inputtext:focus, .ui-inputnumber:focus input, .ui-dialog .ui-inputtext:focus { outline: 0 none !important; border-color: #007bcb !important; box-shadow: 0 0 0 0.15rem rgba(0, 123, 203, 0.25) !important; transition: none !important; }
        .form-control, .ui-inputfield, .ui-inputmask { width: 100%; box-sizing: border-box; padding: 8px !important; border-radius: 5px !important; border: 1px solid #ccc !important; box-shadow: none !important; }

        .ui-dialog .ui-dialog-titlebar { background: white !important; border: none !important; border-bottom: 1px solid #f0f0f0 !important; padding: 15px 20px !important; }
        .ui-dialog .ui-dialog-title { font-size: 18px !important; color: #333 !important; font-weight: 700 !important; }
        .ui-dialog .ui-dialog-content { padding: 20px !important; background: white !important; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; font-size: 14px; }
        .ui-dialog .ui-dialog-titlebar-close:hover, .ui-dialog .ui-dialog-titlebar-close:focus { background-color: #dc3545 !important; background-image: none !important; border-color: #dc3545 !important; color: #ffffff !important; transform: scale(1.1); transition: all 0.2s ease; opacity: 1 !important; }

        .tienda-container { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
        .tienda-box { flex: 1; min-width: 400px; background: #fff; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 20px; border: 1px solid #f0f0f0; }
        .tienda-box h2 { font-size: 18px; font-weight: 700; margin-top: 0; margin-bottom: 15px; color: #333; border-bottom: 2px solid #007bcb; padding-bottom: 8px; display: inline-block; }
        .total-box { display: flex; justify-content: space-between; align-items: center; background: #f8f9fb; padding: 15px; margin-top: 15px; border-radius: 8px; border: 1px solid #e0e0e0; font-weight: 700; font-size: 18px; color: #333; }
        .total-amount { color: #007bcb; font-size: 22px; }
        .confirm-purchase-container { text-align: right; margin-top: 15px; }
        .search-input { width: 200px !important; margin-right: 10px; }

    </style>
</h:head>

<h:body>
    <div class="sidebar">
        <div class="menu">
            <h:form>
                <h:commandLink action="home.xhtml?faces-redirect=true" actionListener="#{menuBeanUI.setActivePage('home')}" styleClass="#{menuBeanUI.activePage eq 'home' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/home.png" alt="Home Icon" class="menu-icon"/>
                    <span>Home</span>
                </h:commandLink>
                <h:commandLink action="clientes.xhtml?faces-redirect=true" actionListener="#{menuBeanUI.setActivePage('clientes')}" styleClass="#{menuBeanUI.activePage eq 'clientes' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/clientes.png" alt="Clientes Icon" class="menu-icon"/>
                    <span>Clientes</span>
                </h:commandLink>
                <h:commandLink action="tienda.xhtml?faces-redirect=true" actionListener="#{menuBeanUI.setActivePage('tienda')}" styleClass="#{menuBeanUI.activePage eq 'tienda' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/tienda.png" alt="Tienda Icon" class="menu-icon"/>
                    <span>Tienda</span>
                </h:commandLink>
                <h:commandLink action="clases.xhtml?faces-redirect=true" actionListener="#{menuBeanUI.setActivePage('clases')}" styleClass="#{menuBeanUI.activePage eq 'clases' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/clases.png" alt="Clases Icon" class="menu-icon"/>
                    <span>Clases</span>
                </h:commandLink>
                <h:commandLink action="pagos.xhtml?faces-redirect=true" actionListener="#{menuBeanUI.setActivePage('pagos')}" styleClass="#{menuBeanUI.activePage eq 'pagos' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/pagos.png" alt="Pagos Icon" class="menu-icon"/>
                    <span>Pagos</span>
                </h:commandLink>
            </h:form>
        </div>
        <div class="logo-bottom">
            <img src="resources-20250903T164359Z-1-001/resources/rockon-icon.png" alt="Rock On Logo"/>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <img src="resources-20250903T164359Z-1-001/resources/Rock_on_text_logo.png" alt="Rock On Title"/>
        </div>

        <div class="card">
            <h:form id="formProductos">
                <p:growl id="msgs" showDetail="true" life="3000" />

                <div class="tienda-container">
                    <div class="tienda-box">
                        <h2>Catálogo</h2>
                        <p:inputText id="buscarProducto" value="#{productoBeanUI.filtro}" placeholder="Buscar producto..." style="width:100%; margin-bottom:15px;">
                            <p:ajax event="input" listener="#{productoBeanUI.filtrarPorId}" update="tablaProductosMini" delay="300"/>
                        </p:inputText>

                        <p:dataTable id="tablaProductosMini" value="#{productoBeanUI.listaProductos}" var="pro"
                                     selectionMode="single" selection="#{productoBeanUI.productoSeleccionado}" rowKey="#{pro.idItem}"
                                     paginator="true" rows="5" paginatorPosition="bottom"
                                     emptyMessage="Sin productos" styleClass="clean-table">
                            <p:ajax event="rowDblselect" listener="#{tiendaBeanUI.agregarAlCarritoDesdeProductos}"
                                    update=":formProductos:tablaCarrito :formProductos:totalBox :formProductos:msgs :formProductos:tablaProductosMini" />
                            <p:column headerText="Nombre"><h:outputText value="#{pro.nombre}" /></p:column>
                            <p:column headerText="Precio" width="30%"><h:outputText value="$#{pro.precio}" /></p:column>
                            <p:column headerText="Stock" width="20%"><h:outputText value="#{pro.stock}" /></p:column>
                        </p:dataTable>
                    </div>

                    <div class="tienda-box" style="background: #fdfdfd;">
                        <h2>Carrito de Compra</h2>
                        <p:dataTable id="tablaCarrito" value="#{tiendaBeanUI.carrito}" var="item"
                                     paginator="false" emptyMessage="Carrito vacío"
                                     selectionMode="single" selection="#{tiendaBeanUI.itemSeleccionado}" rowKey="#{item.id}"
                                     styleClass="clean-table">
                            <p:ajax event="rowDblselect" listener="#{tiendaBeanUI.devolverProductoAlInventario}"
                                    update=":formProductos:tablaCarrito :formProductos:tablaProductosMini :formProductos:totalBox :formProductos:msgs" />
                            <p:column headerText="Producto"><h:outputText value="#{item.nombre}" /></p:column>
                            <p:column headerText="Cant." width="20%"><h:outputText value="#{item.cantidad}" /></p:column>
                            <p:column headerText="Subtotal" width="30%"><h:outputText value="$#{item.precio * item.cantidad}" /></p:column>
                        </p:dataTable>

                        <h:panelGroup id="totalBox" layout="block" styleClass="total-box">
                            <span>Total a Pagar:</span>
                            <h:outputText value="#{tiendaBeanUI.total}" styleClass="total-amount">
                                <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2" />
                            </h:outputText>
                        </h:panelGroup>

                        <div class="confirm-purchase-container">
                            <p:commandButton value="Cobrar"
                                             icon="pi pi-money-bill"
                                             onclick="PF('dlgAskId1').show();"
                                             styleClass="btn-custom" />
                        </div>
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;"/>

                <div class="card-header">
                    <h2>Inventario General</h2>
                    <div class="action-buttons">
                        <p:inputText id="txtFiltroProducto" value="#{productoBeanUI.filtro}" placeholder="ID Producto" styleClass="search-input">
                            <p:ajax event="input" listener="#{productoBeanUI.filtrarPorId}" update="tablaProductos" delay="300"/>
                        </p:inputText>
                        <p:commandButton value="Actualizar" icon="pi pi-refresh" action="#{productoBeanUI.recargar}" update="tablaProductos" styleClass="btn-custom"/>
                        <p:commandButton value="Nuevo" icon="pi pi-plus" onclick="PF('dlgAgregarProducto').show(); return false;" type="button" styleClass="btn-custom"/>
                        <p:commandButton value="Modificar" icon="pi pi-pencil" onclick="PF('dlgBuscarProd').show(); return false;" type="button" styleClass="btn-custom"/>
                        <p:commandButton value="Baja" icon="pi pi-trash" onclick="PF('dlgEliminarProducto').show(); return false;" type="button" styleClass="btn-danger"/>
                    </div>
                </div>

                <p:dataTable id="tablaProductos" value="#{productoBeanUI.listaProductos}" var="pro"
                             paginator="true" rows="8" emptyMessage="No hay productos registrados"
                             paginatorPosition="bottom" styleClass="clean-table">
                    <p:column headerText="ID" width="15%"><h:outputText value="#{pro.idItem}" style="font-weight:600;"/></p:column>
                    <p:column headerText="Nombre"><h:outputText value="#{pro.nombre}"/></p:column>
                    <p:column headerText="Stock"><h:outputText value="#{pro.stock}"/></p:column>
                    <p:column headerText="Precio"><h:outputText value="$#{pro.precio}"/></p:column>
                    <p:column headerText="Proveedor"><h:outputText value="#{pro.proveedor}"/></p:column>
                </p:dataTable>
            </h:form>
        </div>
    </div>

    <p:dialog header="Nuevo Producto" widgetVar="dlgAgregarProducto" modal="true" resizable="false" width="400" appendTo="@(body)">
        <h:form id="formAltaProducto">
            <p:messages id="msgsAltaProducto" showDetail="true" closable="true"/>
            <div class="form-group"><h:outputLabel value="Nombre"/><p:inputText value="#{altaProdBeanUI.nombre}" required="true"/></div>
            <div class="form-group"><h:outputLabel value="Stock"/><p:inputNumber value="#{altaProdBeanUI.stock}" decimalPlaces="0" required="true"/></div>
            <div class="form-group"><h:outputLabel value="Precio"/><p:inputNumber value="#{altaProdBeanUI.precio}" symbol="$" symbolPosition="p" required="true"/></div>
            <div class="form-group"><h:outputLabel value="Proveedor"/><p:inputText value="#{altaProdBeanUI.proveedor}" required="true"/></div>
            <p:commandButton value="Registrar" action="#{altaProdBeanUI.altaProducto}" update="msgsAltaProducto :formProductos:tablaProductos" styleClass="btn-custom" style="width:100%"/>
        </h:form>
    </p:dialog>

    <p:dialog header="Buscar Producto" widgetVar="dlgBuscarProd" modal="true" resizable="false" width="350" appendTo="@(body)">
        <h:form id="formBuscarProd">
            <p:messages id="msgsAsk" showDetail="true" closable="true" />
            <div class="form-group"><h:outputLabel value="ID Producto"/><p:inputText value="#{modificarProdBeanUI.busquedaId}" placeholder="Ej. PR1001" required="true"/></div>
            <p:commandButton value="Buscar" icon="pi pi-search" action="#{modificarProdBeanUI.cargarProductoPorId}"
                             update="msgsAsk :formModificarProd"
                             oncomplete="if (args &amp;&amp; args.found){PF('dlgBuscarProd').hide();PF('dlgModificarProd').show();}"
                             styleClass="btn-custom" style="width:100%"/>
        </h:form>
    </p:dialog>

    <p:dialog header="Modificar Producto" widgetVar="dlgModificarProd" modal="true" resizable="false" width="400" appendTo="@(body)">
        <h:form id="formModificarProd">
            <p:messages id="msgsModificar" showDetail="true" closable="true" />
            <div class="form-group"><h:outputLabel value="Nombre"/><p:inputText value="#{modificarProdBeanUI.nombre}" required="true"/></div>
            <div class="form-group"><h:outputLabel value="Stock"/><p:inputNumber value="#{modificarProdBeanUI.stock}" decimalPlaces="0" required="true"/></div>
            <div class="form-group"><h:outputLabel value="Precio"/><p:inputNumber value="#{modificarProdBeanUI.precio}" symbol="$" required="true"/></div>
            <div class="form-group"><h:outputLabel value="Proveedor"/><p:inputText value="#{modificarProdBeanUI.proveedor}" required="true"/></div>
            <p:commandButton value="Guardar Cambios" styleClass="btn-custom" style="width:100%"/>
        </h:form>
    </p:dialog>

    <p:dialog header="Eliminar Producto" widgetVar="dlgEliminarProducto" modal="true" resizable="false" width="350" appendTo="@(body)">
        <h:form id="formEliminarProd">
            <p:messages id="msgsEliminarProducto" showDetail="true" closable="true"/>
            <div class="form-group"><h:outputLabel value="ID Producto"/><p:inputText value="#{bajaProductoBeanUI.idProducto}" required="true"/></div>
            <p:commandButton value="Eliminar" icon="pi pi-trash" styleClass="btn-danger" style="width:100%" onclick="PF('dlgConfirmar').show(); return false;"/>

            <p:confirmDialog widgetVar="dlgConfirmar" header="Confirmación" message="¿Eliminar producto?" showEffect="fade" hideEffect="fade" appendTo="@(body)">
                <p:commandButton value="Sí, eliminar" action="#{bajaProductoBeanUI.eliminarProducto}" update=":formEliminarProd:msgsEliminarProducto :formProductos:tablaProductos" oncomplete="PF('dlgConfirmar').hide();" styleClass="btn-danger"/>
                <p:commandButton value="Cancelar" onclick="PF('dlgConfirmar').hide();" type="button" styleClass="btn-custom"/>
            </p:confirmDialog>
        </h:form>
    </p:dialog>

    <p:dialog header="Identifícate" widgetVar="dlgAskId1" modal="true" resizable="false" width="360" appendTo="@(body)">
        <h:form id="formAskId1">
            <p:messages id="msgsId1" showDetail="true" closable="true"/>
            <div class="form-group"><h:outputLabel value="ID Recepcionista"/><p:inputText id="searchId1" value="#{tiendaBeanUI.idUR}" required="true"/></div>
            <p:commandButton value="Siguiente" action="#{tiendaBeanUI.verificarUsuario}" update="msgsId1" process="@this searchId1"
                             oncomplete="if (!args.validationFailed) { PF('dlgAskId1').hide(); PF('dlgAskPass1').show(); }" styleClass="btn-custom" style="width:100%"/>
        </h:form>
    </p:dialog>

    <p:dialog header="Contraseña" widgetVar="dlgAskPass1" modal="true" resizable="false" width="360" appendTo="@(body)">
        <h:form id="formAskPass1">
            <p:messages id="msgsPass1" showDetail="true" closable="true"/>
            <div class="form-group"><h:outputLabel value="Contraseña"/><p:password id="pass1" value="#{tiendaBeanUI.contrasenaUR}" required="true"/></div>
            <p:commandButton value="Validar" action="#{tiendaBeanUI.validarContrasena}" update="msgsPass1" process="@this pass1"
                             oncomplete="if (!args.validationFailed) { PF('dlgAskPass1').hide(); PF('dlgMetodoPago1').show(); }" styleClass="btn-custom" style="width:100%"/>
        </h:form>
    </p:dialog>

    <p:dialog header="Método de Pago" widgetVar="dlgMetodoPago1" modal="true" resizable="false" width="360" appendTo="@(body)">
        <h:form id="formMetodoPago1">
            <h:panelGrid id="panelMetodoPago1" columns="1" style="width:100%; gap:10px;">
                <p:messages id="msgsMetodoPago1" showDetail="true" closable="true"/>
                <div class="form-group"><h:outputLabel value="Cliente"/><p:inputText id="cliente1" value="#{tiendaBeanUI.idCliente}" placeholder="CLI1000"/></div>
                <div class="form-group"><h:outputLabel value="Descuento"/><p:inputText id="descuento1" value="#{tiendaBeanUI.descuento}" placeholder="$0"/></div>

                <p:commandButton value="Efectivo" icon="pi pi-money-bill" actionListener="#{tiendaBeanUI.prepararPago()}"
                                 process="@this cliente1 descuento1" update="panelMetodoPago1 :formPagoInteractivo1:panelPagoInteractivo1 :formAplicarCredito1:panelAplicarCredito1"
                                 oncomplete="if (!args.validationFailed) { PF('dlgMetodoPago1').hide(); if (args.tieneCredito) { PF('dlgAplicarCredito1').show(); } else { PF('dlgPagoInteractivo1').show(); } }"
                                 styleClass="btn-custom" style="width:100%">
                    <f:param name="proximo" value="dlgPagoInteractivo1" />
                </p:commandButton>

                <p:commandButton value="Tarjeta" icon="pi pi-credit-card" actionListener="#{tiendaBeanUI.prepararPago()}"
                                 process="@this cliente1 descuento1" update="panelMetodoPago1 :formPagoTarjeta1:panelPagoTarjeta1 :formAplicarCredito1:panelAplicarCredito1"
                                 oncomplete="if (!args.validationFailed) { PF('dlgMetodoPago1').hide(); if (args.tieneCredito) { PF('dlgAplicarCredito1').show(); } else { PF('dlgPagoTarjeta1').show(); } }"
                                 styleClass="btn-custom" style="width:100%">
                    <f:param name="proximo" value="dlgPagoTarjeta1" />
                </p:commandButton>

                <p:commandButton value="Por Pagar" icon="pi pi-book" actionListener="#{tiendaBeanUI.prepararPago()}"
                                 process="@this cliente1 descuento1" update="panelMetodoPago1 :formPagoPorPagarM:panelPagoPorPagarM :formAplicarCredito1:panelAplicarCredito1"
                                 oncomplete="if (!args.validationFailed) { PF('dlgMetodoPago1').hide(); if (args.tieneCredito) { PF('dlgAplicarCredito1').show(); } else { PF('dlgPagoPorPagarM').show(); } }"
                                 styleClass="btn-warning" style="width:100%">
                    <f:param name="proximo" value="dlgPagoTarjeta1" />
                </p:commandButton>
            </h:panelGrid>
        </h:form>
    </p:dialog>

    <p:dialog header="Crédito Disponible" widgetVar="dlgAplicarCredito1" modal="true" resizable="false" width="400" appendTo="@(body)">
        <h:form id="formAplicarCredito1">
            <h:panelGrid id="panelAplicarCredito1" columns="1" style="width:100%; text-align:center;">
                <p:messages id="msgsCredito1" showDetail="true" closable="true"/>
                <h:outputText value="Crédito disponible:" style="color:#555;"/>
                <h:outputText value="#{tiendaBeanUI.cliente.credito}" style="font-size:20px; font-weight:bold; color:#28a745;"><f:convertNumber type="currency" currencySymbol="$"/></h:outputText>
                <div style="margin-top:15px;">
                    <p:commandButton value="Usar Crédito" action="#{tiendaBeanUI.aplicarCredito}" process="@this"
                                     update="panelAplicarCredito1 msgsCredito1 :formPagoTarjeta1:panelPagoTarjeta1 :formPagoInteractivo1:panelPagoInteractivo1 :formPagoPorPagarM:panelPagoPorPagarM"
                                     oncomplete="if (!args.validationFailed) { PF('dlgAplicarCredito1').hide(); PF('#{tiendaBeanUI.siguienteDialogo}').show(); }" styleClass="btn-custom" style="margin-right:10px;"/>
                    <p:commandButton value="No Usar" type="button" onclick="PF('dlgAplicarCredito1').hide(); PF('#{tiendaBeanUI.siguienteDialogo}').show();" styleClass="btn-danger"/>
                </div>
            </h:panelGrid>
        </h:form>
    </p:dialog>

    <p:dialog header="Pago con Tarjeta" widgetVar="dlgPagoTarjeta1" modal="true" resizable="false" width="400" appendTo="@(body)">
        <h:form id="formPagoTarjeta1">
            <h:panelGrid id="panelPagoTarjeta1" columns="1" style="width:100%;">
                <p:messages id="msgsTarjeta1" showDetail="true" closable="true"/>
                <div class="form-group"><h:outputLabel value="Cliente"/><h:outputText value="#{tiendaBeanUI.cliente.nombreCompleto}" style="font-weight:bold"/></div>
                <div class="form-group"><h:outputLabel value="Total"/><h:outputText value="#{tiendaBeanUI.montoTotal}" style="font-weight:bold; font-size:18px"/></div>
                <p:commandButton value="Pagar" actionListener="#{tiendaBeanUI.realizarPagoTarjetaCarrito()}" update="msgsTarjeta1" styleClass="btn-custom" style="width:100%"/>
            </h:panelGrid>
        </h:form>
    </p:dialog>

    <p:dialog header="Pago en Efectivo" widgetVar="dlgPagoInteractivo1" modal="true" resizable="false" width="400" appendTo="@(body)">
        <h:form id="formPagoInteractivo1">
            <h:panelGrid id="panelPagoInteractivo1" columns="1" style="width:100%;">
                <p:messages id="msgsPagoInteractivo1" showDetail="true" closable="true"/>
                <div class="form-group"><h:outputLabel value="Monto Recibido"/><p:inputText id="montoIngresado1" value="#{tiendaBeanUI.montoIngresado}"><p:ajax event="keyup" update="faltante1" process="@this"/></p:inputText></div>
                <div class="form-group"><h:outputLabel value="Faltante"/><h:outputText id="faltante1" value="#{tiendaBeanUI.montoFaltante}" style="color:red; font-weight:bold"/></div>
                <p:commandButton value="Pagar" action="#{tiendaBeanUI.realizarPagoInteractivoCarrito()}" update="msgsPagoInteractivo1 faltante1" process="@this montoIngresado1" styleClass="btn-custom" style="width:100%"/>
            </h:panelGrid>
        </h:form>
    </p:dialog>

    <p:dialog header="Cambio" widgetVar="dlgCambio1" modal="true" resizable="false" width="300" appendTo="@(body)">
        <h:form id="formCambio1">
            <div style="text-align:center; padding:10px;">
                <h:outputText value="Cambio a entregar:"/><br/>
                <h:outputText value="$#{tiendaBeanUI.montoCambio}" style="font-size:24px; font-weight:bold; color:#28a745;"/><br/><br/>
                <p:commandButton value="Finalizar" actionListener="#{tiendaBeanUI.limpiarCampos()}" onclick="PF('dlgCambio1').hide();" update=":formProductos" styleClass="btn-custom"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog header="Confirmar Deuda" widgetVar="dlgPagoPorPagarM" modal="true" resizable="false" width="400" appendTo="@(body)">
        <h:form id="formPagoPorPagarM">
            <h:panelGrid id="panelPagoPorPagarM" columns="1" style="width:100%;">
                <p:messages id="msgsPorPagarM" showDetail="true" closable="true"/>
                <h:outputText value="¿Registrar como deuda pendiente?" style="display:block; text-align:center; margin-bottom:15px;"/>
                <div style="display:flex; gap:10px;">
                    <p:commandButton value="Sí, Registrar" actionListener="#{tiendaBeanUI.realizarPagoPorPagar()}" update="msgsPorPagarM" styleClass="btn-custom" style="flex:1"/>
                    <p:commandButton value="Cancelar" actionListener="#{tiendaBeanUI.limpiarCampos()}" onclick="PF('dlgPagoPorPagarM').hide();" styleClass="btn-danger" style="flex:1"/>
                </div>
            </h:panelGrid>
        </h:form>
    </p:dialog>

    <p:dialog header="Éxito" widgetVar="dlgExitoTarjeta1" modal="true" resizable="false" width="300" appendTo="@(body)">
        <h:form>
            <div style="text-align:center;">
                <i class="pi pi-check-circle" style="font-size:3rem; color:#28a745;"></i><br/>
                <h:outputText value="Operación Exitosa" style="font-weight:bold; display:block; margin:10px 0;"/>
                <p:commandButton value="Aceptar" actionListener="#{RealizarPagoBeanUI.limpiarCampos()}" onclick="PF('dlgExitoTarjeta1').hide();" update=":formProductos" styleClass="btn-custom"/>
            </div>
        </h:form>
    </p:dialog>

    <p:dialog header="Éxito" widgetVar="dlgExitoPorPagar" modal="true" resizable="false" width="300" appendTo="@(body)">
        <h:form>
            <div style="text-align:center;">
                <i class="pi pi-check-circle" style="font-size:3rem; color:#28a745;"></i><br/>
                <h:outputText value="Deuda Registrada" style="font-weight:bold; display:block; margin:10px 0;"/>
                <p:commandButton value="Aceptar" actionListener="#{RealizarPagoBeanUI.limpiarCampos()}" onclick="PF('dlgExitoPorPagar').hide();" update=":formProductos" styleClass="btn-custom"/>
            </div>
        </h:form>
    </p:dialog>

</h:body>
</html>
