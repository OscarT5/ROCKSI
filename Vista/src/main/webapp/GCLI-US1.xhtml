<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
    <!--Hoja de estilo que edita los perfiles predefinidos del diseno de los componentes de primefaces - -->
    <!-- y en general -->
    <style>
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-hover,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-focus {
            background: transparent !important;
            border: none !important;
            color: #555 !important;
            position: absolute !important;
            right: 10px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            transition: all 0.3s ease !important;
            box-shadow: none !important;
        }

        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close:hover,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-hover:hover {
            background-color: #dc3545 !important;
            color: #fff !important;
            border-radius: 50% !important;
            width: 28px !important;
            height: 28px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .ui-dialog-title {
            width: 100% !important;
            text-align: center !important;
            font-size: 24px !important;
            font-weight: 700 !important;
            color: #000 !important;
        }

        .ui-dialog-content, .ui-widget-content {
            background-color: #fff;
            border-radius: 15px;
            border: none;
            color: #000;
            padding: 20px;
        }

        .ui-dialog {
            background: white !important;
            border-radius: 15px !important;
            border: none !important;
        }

        .ui-dialog-titlebar {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            position: relative;
            background: white !important;
            border: none !important;
            box-shadow: none !important;
        }

        .ui-dialog-content {
            background: white !important;
            border: none !important;
        }

        .form-control, .ui-inputfield {
            border: none;
            border-bottom: 2px solid #ccc;
            border-radius: 0;
            background: transparent;
            color: #000;
            font-size: 15px;
        }

        .form-control:focus, .ui-inputfield:focus {
            border-color: #919191 !important;
            outline: none !important;
        }

        .ui-button,
        .ui-button.ui-state-default,
        .ui-button.ui-button-success,
        .btn,
        .btn-success {
            border: none !important;
            border-radius: 8px !important;
            padding: 10px 16px !important;
            font-weight: 600 !important;
            font-size: 15px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 15px auto 0 auto !important;
            width: 80% !important;
        }

        .ui-button .pi {
            margin-right: 8px;
            font-size: 16px;
        }
    </style>
</h:head>
<h:body>

    <h:form id="formPrincipal">
        <!--Boton de la pagina principal que al hacer clic en el abre el modal-->
        <p:commandButton value="Agregar Cliente"
                         icon="pi pi-user-plus"
                         onclick="PF('dlgAgregarCliente').show();"
                         type="button"/>

        <!--Titulo y configuracion del modal modal-->
        <p:dialog header="Nuevo cliente"
                  widgetVar="dlgAgregarCliente"
                  modal="true"
                  resizable="false"
                  closable="true"
                  draggable="false"
                  width="400">

            <!--Mensajes-->
            <p:messages id="msgs" showDetail="true" closable="true"/>

            <!--Campo para ingresar nombre-->
            <div class="form-group">
                <h:outputLabel for="nombre" value="Nombre"/>
                <p:inputText id="nombre"
                             value="#{altaCliBeanUI.nombre}"
                             placeholder="Nombre"
                             class="form-control"
                             required="true"
                             requiredMessage="El campo Nombre es obligatorio"/>
            </div>

            <!--Campo para ingresar apellidos-->
            <div class="form-group">
                <h:outputLabel for="apellido" value="Apellidos"/>
                <p:inputText id="apellido"
                             value="#{altaCliBeanUI.apellido}"
                             placeholder="Apellidos"
                             class="form-control"
                             required="true"
                             requiredMessage="El campo Apellidos es obligatorio"/>
            </div>

            <!--Campo para ingresar telefono (solo admite los digitos exactos)-->
            <div class="form-group">
                <h:outputLabel for="telefono" value="Teléfono"/>
                <p:inputMask id="telefono"
                             value="#{altaCliBeanUI.telefono}"
                             mask="(999) 999-9999"
                             placeholder="(686) 185 8942"
                             class="form-control"
                             required="true"
                             requiredMessage="El campo Telefono es obligatorio"/>
            </div>

            <!--Boton de registrar el cliente que dispara la accion definida-->
            <p:commandButton id="registrarBtn"
                             value="Registrar al cliente"
                             action="#{altaCliBeanUI.altaCliente}"
                             update="msgs"
                             icon="pi pi-plus-circle"
                             styleClass="btn"
                             style="background: #007bff !important; background-image: none !important; color: #fff !important; border: none !important; box-shadow: none !important;" />
        </p:dialog>

    </h:form>

</h:body>
</html>
