<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
    <!--Hoja de estilo que edita los perfiles predefinidos del diseno de los componentes de primefaces - -->
    <!-- y en general -->
    <style>
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-hover,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-focus {
            background: transparent !important;
            border: none !important;
            color: #555 !important;
            position: absolute !important;
            right: 10px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            transition: all 0.3s ease !important;
            box-shadow: none !important;
        }

        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close:hover,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-hover:hover {
            background-color: #dc3545 !important;
            color: #fff !important;
            border-radius: 50% !important;
            width: 28px !important;
            height: 28px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .ui-dialog-title {
            width: 100% !important;
            text-align: center !important;
            font-size: 24px !important;
            font-weight: 700 !important;
            color: #000 !important;
        }

        .ui-dialog-content, .ui-widget-content {
            background-color: #fff;
            border-radius: 15px;
            border: none;
            color: #000;
            padding: 20px;
        }

        .ui-dialog {
            background: white !important;
            border-radius: 15px !important;
            border: none !important;
        }

        .ui-dialog-titlebar {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            position: relative;
            background: white !important;
            border: none !important;
            box-shadow: none !important;
        }

        .ui-dialog-content {
            background: white !important;
            border: none !important;
        }

        .form-control, .ui-inputfield {
            border: none;
            border-bottom: 2px solid #ccc;
            border-radius: 0;
            background: transparent;
            color: #000;
            font-size: 15px;
        }

        .form-control:focus, .ui-inputfield:focus {
            border-color: #919191 !important;
            outline: none !important;
        }

        .ui-button,
        .ui-button.ui-state-default,
        .ui-button.ui-button-success,
        .btn,
        .btn-success {
            border: none !important;
            border-radius: 8px !important;
            padding: 10px 16px !important;
            font-weight: 600 !important;
            font-size: 15px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 15px auto 0 auto !important;
            width: 80% !important;
        }

        .ui-button .pi {
            margin-right: 8px;
            font-size: 16px;
        }

        .btn-eliminar {
            background: #d61e1e !important;
            color: #fff !important;
            border: none !important;
            border-radius: 8px !important;
            padding: 10px 16px !important;
            font-weight: 600 !important;
            font-size: 15px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 15px auto 0 auto !important;
            width: 80% !important;
        }

        .ui-widget-overlay {
            background: rgba(0, 0, 0, 0.8) !important;
        }

        .btn-cancelar {
            background: #a8a8a8 !important;
            color: white !important;
            border: none !important;
            border-radius: 8px !important;
            padding: 10px 16px !important;
            font-weight: 600 !important;
            font-size: 15px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 15px auto 0 auto !important;
            width: 40% !important;
        }

        .btn-confirmar {
            background: #d61e1e !important;
            color: #fff !important;
            border: none !important;
            border-radius: 8px !important;
            padding: 10px 16px !important;
            font-weight: 600 !important;
            font-size: 15px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 15px auto 0 auto !important;
            width: 40% !important;
        }

        .confirm-content {
            text-align: center !important;
            font-size: 18px !important;
            font-weight: 500 !important;
        }

        .confirm-buttons {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
    </style>
</h:head>
<h:body>

    <!-- BOTONES PRINCIPALES -->
    <h:form id="formBotones">
        <p:commandButton value="Agregar Cliente"
                         icon="pi pi-user-plus"
                         onclick="PF('dlgAgregarCliente').show();"
                         type="button"/>
        <p:commandButton value="Eliminar Cliente"
                         icon="pi pi-user-minus"
                         onclick="PF('dlgEliminarCliente').show();"
                         type="button"
                         style="margin-left:10px; background-color:#d61e1e !important; color:white !important;"/>
        <p:commandButton value="Agregar Clase"
                         icon="pi pi-plus"
                         onclick="PF('dlgAgregarClase').show();"
                         type="button"
                         style="margin-left:10px; background-color:#007bff !important; color:white !important;"/>
    </h:form>


    <!-- MODAL: AGREGAR CLIENTE -->
    <h:form id="formAgregarCliente">
        <p:dialog header="Nuevo cliente"
                  widgetVar="dlgAgregarCliente"
                  modal="true"
                  resizable="false"
                  closable="true"
                  draggable="false"
                  width="400">

            <p:messages id="msgs" showDetail="true" closable="true"/>

            <div class="form-group">
                <h:outputLabel for="nombre" value="Nombre"/>
                <p:inputText id="nombre"
                             value="#{altaCliBeanUI.nombre}"
                             placeholder="Nombre"
                             class="form-control"
                             required="true"
                             requiredMessage="El campo Nombre es obligatorio"/>
            </div>

            <div class="form-group">
                <h:outputLabel for="apellido" value="Apellidos"/>
                <p:inputText id="apellido"
                             value="#{altaCliBeanUI.apellido}"
                             placeholder="Apellidos"
                             class="form-control"
                             required="true"
                             requiredMessage="El campo Apellidos es obligatorio"/>
            </div>

            <div class="form-group">
                <h:outputLabel for="telefono" value="Teléfono"/>
                <p:inputMask id="telefono"
                             value="#{altaCliBeanUI.telefono}"
                             mask="(999) 999-9999"
                             placeholder="(686) 185 8942"
                             class="form-control"
                             required="true"
                             requiredMessage="El campo Teléfono es obligatorio"/>
            </div>

            <p:commandButton id="registrarBtn"
                             value="Registrar al cliente"
                             action="#{altaCliBeanUI.altaCliente}"
                             update="msgs"
                             icon="pi pi-plus-circle"
                             styleClass="btn"
                             style="background: #007bff !important; color: #fff !important; border: none !important;"/>
        </p:dialog>
    </h:form>


    <!--Formulario para eliminar un cliente-->
    <h:form id="formEliminarCliente">
        <p:dialog header="Eliminar"
                  widgetVar="dlgEliminarCliente"
                  modal="true"
                  resizable="false"
                  closable="true"
                  draggable="false"
                  width="400">

            <!--Esto hace que los mensajes del backend se desplieguen-->
            <p:messages id="msgsEliminar" showDetail="true" closable="true"/>

            <div class="form-group">
                <!-- Esta es la conexion con la variable de idCliente que se buscara y eliminara en el backend-->
                <h:outputLabel for="idCliente" value="ID"/>
                <p:inputText id="idCliente"
                             value="#{bajaClienteBeanUI.idCliente}"
                             placeholder="ID del cliente a eliminar"
                             class="form-control"
                             required="true"
                             requiredMessage="El campo ID es obligatorio"/>
            </div>

            <!--Este boton abre la ventana (modal) de confirmacion-->
            <p:commandButton id="eliminarBtn"
                             value="Eliminar Cliente"
                             icon="pi pi-times-circle"
                             styleClass="btn-eliminar"
                             onclick="PF('dlgConfirmarEliminar').show(); PF('dlgEliminarCliente').hide(); return false;"/>
        </p:dialog>
    </h:form>

    <!--Formulario para la confirmacion de si se quiere eliminar un cliente-->
    <h:form id="formConfirmacionEliminar">
        <p:dialog header="Confirmar eliminación"
                  widgetVar="dlgConfirmarEliminar"
                  modal="true"
                  resizable="false"
                  closable="false"
                  draggable="false"
                  width="400">

            <!--este es el texto central-->
            <div class="confirm-content">
                <p style="margin-bottom: 25px;">
                    ¿Seguro que deseas eliminar este cliente?
                </p>
            </div>

            <!--Estos son los 2 botones que hay en la ventana de confirmacion-->
            <div class="confirm-buttons" style="display: flex; justify-content: space-between; gap: 15px; padding-top: 10px;">
                <p:commandButton value="Cancelar"
                                 type="button"
                                 onclick="PF('dlgConfirmarEliminar').hide(); PF('dlgEliminarCliente').show();"
                                 styleClass="btn-cancelar"/>

                <!--Conexion con el backend-->
                <p:commandButton value="Eliminar"
                                 icon="pi pi-times-circle"
                                 action="#{bajaClienteBeanUI.eliminarCliente}"
                                 update="formEliminarCliente:msgsEliminar"
                                 styleClass="btn-confirmar"
                                 oncomplete="if (args &amp;&amp; !args.validationFailed) {
                                    PF('dlgConfirmarEliminar').hide();
                                    PF('dlgEliminarCliente').show();
                                 } else {
                                    PF('dlgConfirmarEliminar').hide();
                                    PF('dlgEliminarCliente').show();
                                 }"
                                    />
                                <!--Esas ultimas lineas son las que cierran la ventana de confirmacion y abren la anterior-->
            </div>
        </p:dialog>
    </h:form>



    <!--Modal para agregar una clase-->
    <h:form id="formAgregarClase">
        <p:dialog header="Nueva clase"
                  widgetVar="dlgAgregarClase"
                  modal="true"
                  resizable="false"
                  closable="true"
                  draggable="false"
                  width="400">

            <!--Despliega los mensajes del backend-->
            <p:messages id="msgsClase" showDetail="true" closable="true"/>

            <!--Aqui se realizan pequenas validaciones de no dejar el campo vacio-->
            <!--tambien por cada campo creado se conecta con la variable del backend-->
            <div class="form-group">
                <h:outputLabel for="nombreClase" value="Nombre"/>
                <p:inputText id="nombreClase"
                             value="#{altaClaseBeanUI.nombre}"
                             placeholder="Nombre"
                             class="form-control"
                             required="true"
                             validatorMessage="El nombre no puede estar vacío"
                             requiredMessage="El campo de nombre es obligatorio">
                    <f:validateRegex pattern=".*\S.*"/>
                </p:inputText>
            </div>

            <div class="form-group">
                <h:outputLabel for="horario" value="Horario"/>
                <p:inputText id="horario"
                             value="#{altaClaseBeanUI.horario}"
                             placeholder="Horario de la clase"
                             class="form-control"
                             required="true"
                             validatorMessage="El horario no puede estar vacío"
                             requiredMessage="El campo Horario es obligatorio">
                    <f:validateRegex pattern=".*\S.*"/>
                </p:inputText>
            </div>

            <div class="form-group">
                <h:outputLabel for="cupo" value="Cupo máximo"/>
                <p:inputText id="cupo"
                             value="#{altaClaseBeanUI.cupoMaximo}"
                             placeholder="Cupo maximo de clientes"
                             class="form-control"
                             required="true"
                             validatorMessage="El cupo máximo no puede estar vacío"
                             requiredMessage="El campo Cupo máximo es obligatorio">
                    <f:validateRegex pattern=".*\S.*"/>
                </p:inputText>
            </div>

            <div class="form-group">
                <h:outputLabel for="maestro" value="Maestro"/>
                <p:inputText id="maestro"
                             value="#{altaClaseBeanUI.maestro}"
                             placeholder="Nombre del maestro"
                             class="form-control"
                             required="true"
                             validatorMessage="El nombre del maestro no puede estar vacio"
                             requiredMessage="El campo Maestro es obligatorio">
                    <f:validateRegex pattern=".*\S.*"/>
                </p:inputText>
            </div>

            <!--Este boton se conecta con el backend-->
            <p:commandButton id="registrarClaseBtn"
                             value="Registrar la clase"
                             icon="pi pi-plus-circle"
                             update="@form"
                             process="@form"
                             styleClass="btn"
                             style="background: #007bff !important; color: #fff !important; border: none !important;"/>
        </p:dialog>
    </h:form>

</h:body>
</html>
